<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Voß & Partner — Imagefilm</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../../assets/vp-tools/font/inter-400.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../../assets/vp-tools/font/inter-600.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('../../assets/vp-tools/font/inter-700.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('../../assets/vp-tools/font/inter-800.ttf'); }
  html, body { margin: 0; background: #0E2A45; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, spring, springType, hash } from '../../lib/motion.js';
import { DUR, WIPES, COVER, SCENES, STAGE, sceneStart, TXT, MANDATE, MESSEN, reelPos } from './timeline.mjs';

/* ============================================================
   Imagefilm Voß & Partner für Kunden. Neun Kapitel im CI der Stellenanzeigen:
   Hero-Video auf Marine, helle Bühne mit Dreiecksmotiv, goldenes Mosaik als Kapitelwechsel.
   window.seek(t) ist eine reine Funktion der Zeit (Hero-Video als Einzelbilder, deterministisch).
   ============================================================ */
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = window.innerWidth, H = window.innerHeight; c.width = W; c.height = H;
const FF = "'Inter', 'Segoe UI', Arial, sans-serif";
const CI = { bg: '#F4F5F6', ink: '#111418', navy: '#0F3556', steel: '#2E6FB2', steelHi: '#5E9DCD', gold: '#E8C33C', grau: '#6E737B', chip: '#E6EBF1', gruen: '#2E7D32', crimson: '#8B1A3C' };
const WHITE = '#FFFFFF', LBLUE = '#A9C7E4';
await Promise.all(['400', '600', '700', '800'].map((w) => document.fonts.load(`${w} 40px Inter`)));
const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const [LOGO_W, LOGO_H, LOGO_F] = await Promise.all([loadImg('../../assets/vp-tools/logo/logo-weiss.png'), loadImg('../../assets/vp-tools/logo/logo-hell.png'), loadImg('../../assets/vp-tools/logo/logo-farbe.png')]);

/* ---------- Maße ---------- */
const U = Math.min(W, H) / 1080, LAND = W > H * 1.2, M = Math.round((LAND ? 140 : 90) * U), CW = W - 2 * M;
let t = 0;
const sp = (t0, k = 170, d = 26) => spring(t - t0, k, d);
const st = (t0, k = 170) => springType(t - t0, k);
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.min(r, Math.max(0, w) / 2, Math.max(0, h) / 2)); };
function text(str, x, y, w, px, color, align = 'left', ls = 0) { ctx.font = `${w} ${px}px ${FF}`; ctx.letterSpacing = `${ls}px`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y); ctx.textAlign = 'left'; ctx.letterSpacing = '0px'; }
function measure(str, w, px, ls = 0) { ctx.font = `${w} ${px}px ${FF}`; ctx.letterSpacing = `${ls}px`; const m = ctx.measureText(str).width; ctx.letterSpacing = '0px'; return m; }
function wrapLines(str, maxW, w, px) { const out = []; let line = ''; for (const wd of str.split(' ')) { const tt = line ? line + ' ' + wd : wd; if (measure(tt, w, px) > maxW && line) { out.push(line); line = wd; } else line = tt; } if (line) out.push(line); return out; }
// wie wrapLines, bricht aber nur zwischen ganzen Einträgen „a · b · c“ um
function wrapItems(str, maxW, w, px) { const out = []; let line = ''; for (const it of str.split(' · ')) { const tt = line ? line + ' · ' + it : it; if (measure(tt, w, px) > maxW && line) { out.push(line); line = it; } else line = tt; } if (line) out.push(line); return out; }
function fitPx(str, w, px, maxW) { while (px > 10 && measure(str, w, px) > maxW) px -= 0.5; return px; }
// Zeile steigt aus einer Maske (kein bloßes Einblenden)
function rise(str, x, y, w, px, color, t0, align = 'left', ls = 0) {
  const p = st(t0, 200); if (p <= 0.001) return; const wd = measure(str, w, px, ls), x0 = align === 'center' ? x - wd / 2 : align === 'right' ? x - wd : x;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - px * 0.3, y - px * 1.05, wd + px * 0.8, px * 1.4); ctx.clip(); text(str, x, y + (1 - p) * px * 1.15, w, px, color, align, ls); ctx.restore();
}
function eyebrow(txt, x, y, t0, col) {
  const bar = st(t0, 260); if (bar <= 0) return; ctx.fillStyle = CI.gold; rr(x, y - 9 * U, 46 * U * bar, 6 * U, 3 * U); ctx.fill();
  const n = Math.floor(txt.length * clamp((t - t0 - 0.12) / 0.5)); if (n > 0) text(txt.slice(0, n), x + 62 * U, y, 800, 22 * U, col, 'left', 5.5 * U);
}
function goldDot(x, y, px, t0) { const d = sp(t0, 320, 16); if (d <= 0) return; ctx.save(); ctx.translate(x + px * 0.13, y - px * 0.09); ctx.scale(Math.max(0.001, d), Math.max(0.001, d)); text('.', -px * 0.13, px * 0.09, 800, px, CI.gold); ctx.restore(); }
const tri = (x, y, size, up) => { const hw = size / 2, hh = size * 0.866 / 2; ctx.beginPath(); if (up) { ctx.moveTo(x, y - hh); ctx.lineTo(x - hw, y + hh); ctx.lineTo(x + hw, y + hh); } else { ctx.moveTo(x, y + hh); ctx.lineTo(x - hw, y - hh); ctx.lineTo(x + hw, y - hh); } ctx.closePath(); ctx.fill(); };

/* ---------- Hero-Video von voss-partner.de (Einzelbilder, 30 fps) ---------- */
const VID = { n: 425, fps: 30, cache: new Map() };
let vidImg = null;
async function videoFrame(tv) {
  const i = 1 + (Math.floor(tv * VID.fps) % VID.n); if (VID.cache.has(i)) return VID.cache.get(i);
  const img = await loadImg(`../../assets/web/hero/${String(i).padStart(4, '0')}.jpg`); if (!img) return null;
  VID.cache.set(i, img); if (VID.cache.size > 10) VID.cache.delete(VID.cache.keys().next().value); return img;
}
function drawNavy(u, dark) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0A1626'); g.addColorStop(0.55, '#0E2A45'); g.addColorStop(1, '#0F3D63');
  if (vidImg) { const iw = vidImg.naturalWidth, ih = vidImg.naturalHeight, z = 1.08 + 0.06 * clamp(u / 14), sc = Math.max(W / iw, H / ih) * z, dw = iw * sc, dh = ih * sc;
    ctx.drawImage(vidImg, (W - dw) / 2 + Math.sin(t * 0.13) * W * 0.02, (H - dh) / 2, dw, dh); ctx.globalAlpha = dark ? 0.88 : 0.72; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  else { ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createLinearGradient(0, 0, 0, H); v.addColorStop(0, 'rgba(0,0,0,0.25)'); v.addColorStop(0.45, 'rgba(0,0,0,0.04)'); v.addColorStop(1, 'rgba(0,0,0,0.32)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
/* ---------- Helle Bühne: Hintergrund und Dreiecksmotiv der Stellenanzeigen (oben rechts, schimmert) ---------- */
function ciRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

const TRI = [];
{
  const rnd = ciRng(20260714), protect = H * (LAND ? 0.36 : 0.28), fadeBand = H * 0.10;
  const fieldAt = (x, y) => { const cx = W * 1.02, cy = -H * 0.06, rx = W * (LAND ? 0.5 : 0.74), ry = H * 0.36; const d = Math.sqrt(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2); const wob = (Math.sin(x * 0.011 + y * 0.017) + Math.sin(y * 0.009 - x * 0.006)) * 0.09; return 1 - (d + wob) + (rnd() - 0.5) * 0.16; };
  const cell = Math.max(12, Math.round(Math.min(W, H * 0.8) / 42)), colStep = cell * 0.5, rowStep = cell * 0.866, rows = Math.ceil((H * 0.42) / rowStep), cols = Math.ceil(W / colStep) + 2;
  for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) {
    const x = cc * colStep, y = r * rowStep + rowStep * 0.5, tt = fieldAt(x, y);
    if (tt <= 0.05) { rnd(); rnd(); continue; } if (tt < 0.30 && rnd() > tt / 0.30) { rnd(); continue; }
    const s0 = 0.94 + rnd() * 0.06, core = clamp((tt - 0.35) / 0.55), size = Math.min(cell * (0.50 + 0.42 * core) * s0, cell * 0.86);
    const fade = y <= protect - fadeBand ? 1 : clamp((protect - y) / fadeBand); const zh = ((Math.imul(r + 1, 73856093) ^ Math.imul(cc + 7, 19349663)) >>> 0) % 1000 / 1000; if (fade <= 0 || zh > fade) { rnd(); rnd(); continue; }
    const acc = rnd(); let col;
    if (acc < 0.02) col = CI.gruen; else if (acc < 0.04) col = CI.crimson; else if (acc < 0.06) col = CI.gold;
    else { const f = clamp(1 - tt) * 0.85 + rnd() * 0.15; col = (acc < 0.40) ? ciMix(CI.steelHi, '#EAF1F7', f) : ciMix(CI.navy, '#DCE7F1', f * 0.9); }
    if (size >= 1.6) TRI.push({ x, y, size, t: tt, col, up: (r + cc) % 2 === 0, alpha: Math.min(0.80, 0.30 + tt * 0.60) * (0.4 + 0.6 * fade) });
  }
}
function drawLight(s0) {
  ctx.fillStyle = CI.bg; ctx.fillRect(0, 0, W, H);
  for (const p of TRI) { const q = sp(s0 + (1 - clamp(p.t)) * 0.7 + (p.y / H) * 0.5, 150, 20); if (q <= 0.001) continue;
    const shimmer = 0.08 * Math.sin((t - s0) * Math.PI + hash(p.x * 0.37 + p.y * 0.11) * 6.28);
    ctx.globalAlpha = clamp(p.alpha * clamp(q) + shimmer * clamp(q), 0, 0.9); ctx.fillStyle = p.col; tri(p.x, p.y, p.size * Math.min(1.12, q), p.up); }
  ctx.globalAlpha = 1;
}
/* ---------- Goldenes Mosaik als Kapitelwechsel ---------- */
const MW = (() => { const cell = Math.round(Math.max(W, H) / 8.5), cs = cell * 0.5, rs = cell * 0.866, out = [], rows = Math.ceil(H / rs) + 1, cols = Math.ceil(W / cs) + 2; for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) { const x = cc * cs, y = r * rs + rs * 0.5; out.push({ x, y, up: (r + cc) % 2 === 0, d: ((x / W) * 0.55 + (y / H) * 0.45) * 0.24 }); } return { cell, out }; })();
const sstep = (x) => x * x * (3 - 2 * x);
function drawMosaic() { for (const tw of WIPES) { if (t < tw || t > tw + 0.85) continue; ctx.fillStyle = CI.gold; for (const m of MW.out) { const p = clamp((t - tw - m.d) / 0.13), q = clamp((t - tw - 0.4 - m.d) / 0.13), k = sstep(p) * (1 - sstep(q)); if (k > 0.001) tri(m.x, m.y, MW.cell * 1.07 * k, m.up); } } }
function drawLogo(s0, light) { const img = light ? LOGO_H : LOGO_W; if (!img) return; const q = sp(s0 + 0.15, 160, 18); if (q <= 0) return; const h = (LAND ? 78 : 88) * U, w = h * img.naturalWidth / img.naturalHeight;
  ctx.save(); ctx.globalAlpha = clamp(q * 2); ctx.translate(Math.round(W * 0.045) + w / 2, Math.round(H * 0.045) + h / 2); ctx.scale(Math.max(0.001, q), Math.max(0.001, q)); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore(); }

/* ============================================================ Szenen ============================================================ */
// 0) Intro: farbiges Originallogo auf heller Bühne mit Dreiecksmotiv
function sIntro(s0) {
  const img = LOGO_F || LOGO_H; if (!img) return; const q = sp(s0 + 0.2, 150, 17); if (q <= 0) return;
  const h = Math.min(H * 0.38, 400 * U), w = h * img.naturalWidth / img.naturalHeight, cy = H * 0.46;
  ctx.save(); ctx.globalAlpha = clamp(q * 1.8); ctx.translate(W / 2, cy + (1 - Math.min(q, 1)) * 30 * U); const k = 0.86 + 0.14 * q; ctx.scale(k, k); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
  const g = st(s0 + 1.0, 220); if (g > 0) { ctx.fillStyle = CI.gold; rr(W / 2 - 60 * U * g, cy + h / 2 + 48 * U, 120 * U * g, 6 * U, 3 * U); ctx.fill(); }
  rise(TXT.intro.line, W / 2, cy + h / 2 + 108 * U, 800, 26 * U, CI.navy, s0 + 1.2, 'center', 7 * U);
}
// 1) Einstieg: Hero-Video, „Wir finden die Richtigen.“
function sOpen(s0) {
  const T = TXT.open, cS = (LAND ? 136 : 112) * U, sS = 32 * U, subW = LAND ? W * 0.52 : CW, sub = wrapLines(T.sub, subW, 400, sS);
  const blockH = 50 * U + cS * 2.2 + 40 * U + sub.length * sS * 1.45, y0 = H * 0.53 - blockH / 2;
  eyebrow(T.eyebrow, M, y0, s0 + 0.8, LBLUE);
  rise(T.claim[0], M, y0 + 50 * U + cS, 800, cS, WHITE, s0 + 1.6, 'left', -2 * U);
  rise(T.claim[1], M, y0 + 50 * U + cS * 2.12, 800, cS, WHITE, s0 + 2.4, 'left', -2 * U); goldDot(M + measure(T.claim[1], 800, cS, -2 * U), y0 + 50 * U + cS * 2.12, cS, s0 + 2.9);
  sub.forEach((l, i) => rise(l, M, y0 + 50 * U + cS * 2.12 + 40 * U + sS * 1.25 + i * sS * 1.45, 400, sS, '#D5E2EE', s0 + 4 + i * 0.12));
}
// 2) Marktkenntnis: Jahreszähler und Branchen
function sMarkt(s0) {
  const T = TXT.markt, y0 = H * (LAND ? 0.2 : 0.24), yS = (LAND ? 230 : 170) * U, lS = (LAND ? 42 : 36) * U, chS = (LAND ? 31 : 26) * U, chH = (LAND ? 70 : 58) * U;
  eyebrow(T.eyebrow, M, y0, s0 + 0.2, CI.navy);
  const yr = Math.round(lerp(1992, 2026, ease((t - s0 - 0.5) / 2.0))), yp = st(s0 + 0.4, 200);
  if (yp > 0) { ctx.save(); ctx.globalAlpha = clamp(yp * 1.5); text(String(yr), M - 6 * U, y0 + 30 * U + yS * 0.86, 800, yS, CI.navy, 'left', -4 * U); ctx.restore(); }
  rise(T.label, M, y0 + 30 * U + yS * 0.86 + 70 * U, 600, lS, CI.ink, s0 + 1.3);
  let x = M, y = y0 + 30 * U + yS * 0.86 + 120 * U;
  T.chips.forEach((ch, i) => { const w = measure(ch, 600, chS) + 48 * U; if (x + w > W - M) { x = M; y += chH + 14 * U; } const q = sp(s0 + 2.8 + i * 0.12, 260, 20);
    if (q > 0) { ctx.save(); ctx.translate(x + w / 2, y + chH / 2); const k = 0.6 + 0.4 * q; ctx.scale(k, k); ctx.globalAlpha = clamp(q * 2.5);
      ctx.fillStyle = CI.chip; rr(-w / 2, -chH / 2, w, chH, chH / 2); ctx.fill(); text(ch, 0, chS * 0.36, 600, chS, CI.navy, 'center'); ctx.restore(); }
    x += w + 12 * U; });
}
// 3) Grundsatz: alle Positionen, Hauptsache in unserer Branche – Pyramide von Fach bis Geschäftsführung
function sGrund(s0) {
  const T = TXT.grund, hS = (LAND ? 70 : 60) * U, colW = LAND ? W * 0.46 : CW, x0 = M, y0 = H * (LAND ? 0.28 : 0.2);
  eyebrow(T.eyebrow, x0, y0, s0 + 0.2, CI.navy);
  const l1 = wrapLines(T.lines[0], colW, 800, hS), l2 = wrapLines(T.lines[1], colW, 800, hS); let y = y0 + 30 * U + hS;
  l1.forEach((l, i) => rise(l, x0, y + i * hS * 1.12, 800, hS, CI.ink, s0 + 0.4 + i * 0.12, 'left', -1.2 * U)); y += l1.length * hS * 1.12;
  l2.forEach((l, i) => rise(l, x0, y + i * hS * 1.12, 800, hS, CI.navy, s0 + 1.2 + i * 0.12, 'left', -1.2 * U)); y += l2.length * hS * 1.12;
  rise(T.note, x0, y + 30 * U, 600, 28 * U, CI.grau, s0 + 5.0);
  // Pyramide
  const lx0 = LAND ? W * 0.56 : M, lw = LAND ? W - M - lx0 : CW, th = 128 * U, gap = 14 * U, ly = LAND ? H * 0.5 - (3 * th + 2 * gap) / 2 : y + 90 * U;
  const tiers = T.tiers, widths = [0.62, 0.81, 1], fills = [CI.gold, CI.navy, '#DCE6F0'], cols = [CI.navy, WHITE, CI.navy];
  for (let k = 2; k >= 0; k--) { const q = sp(s0 + 2.6 + (2 - k) * 0.8, 200, 20); if (q <= 0) continue; const w = lw * widths[k], x = lx0 + (lw - w) / 2, yy = ly + k * (th + gap);
    ctx.save(); ctx.globalAlpha = clamp(q * 2); ctx.translate(0, (1 - q) * 40 * U); ctx.fillStyle = fills[k]; rr(x, yy, w, th, 18 * U); ctx.fill();
    text(tiers[k][0], x + w / 2, yy + 48 * U, 800, 30 * U, cols[k], 'center', -0.3 * U);
    wrapItems(tiers[k][1], w - 48 * U, 400, 21 * U).slice(0, 2).forEach((l, i) => text(l, x + w / 2, yy + 84 * U + i * 27 * U, 400, 21 * U, cols[k], 'center'));
    ctx.restore(); }
}
// 4) Mandate: drei laufende Reihen von Fach bis Geschäftsführung
function sMandate(s0) {
  const T = TXT.mandate, y0 = H * (LAND ? 0.14 : 0.13), hS = (LAND ? 58 : 52) * U;
  eyebrow(T.eyebrow, M, y0, s0 + 0.2, LBLUE);
  const hl = (LAND ? [T.head] : T.head.split(/(?<=\.) /)).flatMap((l) => wrapLines(l, CW, 800, hS)); hl.forEach((l, i) => rise(l, M, y0 + 30 * U + hS + i * hS * 1.12, 800, hS, WHITE, s0 + 0.4 + i * 0.12, 'left', -1 * U));   // 4:5: Umbruch nach dem Punkt
  // Alle Positionen sichtbar: auf 4 bzw. 5 Reihen verteilt, jede Reihe zieht einmal von Anfang bis Ende durch (gerade Reihen nach links, ungerade nach rechts)
  const NR = LAND ? 4 : 5, cw = (LAND ? 470 : 430) * U, ch = (LAND ? 124 : 128) * U, gap = (LAND ? 18 : 20) * U, rowY = y0 + 30 * U + hS * (1 + 1.12 * hl.length) + (LAND ? 40 : 50) * U;
  const per = Math.ceil(MANDATE.length / NR), dur = WIPES[SCENES.indexOf('mandate')] - s0, p0 = s0 + 1.0, p1 = s0 + dur - 1.2, pp = (t - p0) / (p1 - p0);
  const pan = pp <= 0 ? 0 : pp >= 1 ? 1 : pp < 0.08 ? pp * pp / 0.16 : pp > 0.92 ? 1 - (1 - pp) * (1 - pp) / 0.16 : (pp - 0.04) / 0.92;   // weich an, gleichmäßig, weich aus
  for (let r = 0; r < NR; r++) { const row = MANDATE.slice(r * per, (r + 1) * per); if (!row.length) continue; const q = st(s0 + 0.7 + r * 0.2, 160); if (q <= 0) continue;
    const total = row.length * (cw + gap) - gap, travel = Math.max(0, total - CW), x0 = M - (r % 2 ? travel * (1 - pan) : travel * pan), y = rowY + r * (ch + gap);
    ctx.save(); ctx.globalAlpha = q; ctx.translate((1 - q) * (r % 2 ? -60 : 60) * U, 0);
    row.forEach((it, k) => { const bx = x0 + k * (cw + gap); if (bx > W || bx + cw < 0) return;
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(bx, y, cw, ch, 18 * U); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5 * U; ctx.stroke();
      text(it[0], bx + 24 * U, y + 34 * U, 800, 15 * U, CI.gold, 'left', 3 * U);
      text(it[1], bx + 24 * U, y + 72 * U, 700, fitPx(it[1], 700, 26 * U, cw - 48 * U), WHITE);
      text(it[2], bx + 24 * U, y + 104 * U, 400, fitPx(it[2], 400, 19 * U, cw - 48 * U), LBLUE); });
    ctx.restore(); }
  const fg = ctx.createLinearGradient(0, 0, W, 0); fg.addColorStop(0, 'rgba(10,22,38,0.9)'); fg.addColorStop(0.05, 'rgba(10,22,38,0)'); fg.addColorStop(0.95, 'rgba(15,61,99,0)'); fg.addColorStop(1, 'rgba(15,61,99,0.9)');
  ctx.fillStyle = fg; ctx.fillRect(0, rowY - 10 * U, W, NR * (ch + gap) + 20 * U);
  rise(T.note, M, rowY + NR * (ch + gap) + 36 * U, 400, 21 * U, LBLUE, s0 + 1.6);
}
// 5) Echte Direktansprache: Haltung → Visualisierung → vier Schritte
function personIcon(x, y, s) { ctx.beginPath(); ctx.arc(x, y - s * 0.55, s * 0.42, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x, y + s * 0.55, s * 0.72, s * 0.5, 0, Math.PI, 0); ctx.fill(); }
