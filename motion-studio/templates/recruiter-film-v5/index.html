<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Recruiter — Film V5</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../../assets/vp-tools/font/inter-400.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../../assets/vp-tools/font/inter-600.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('../../assets/vp-tools/font/inter-700.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('../../assets/vp-tools/font/inter-800.ttf'); }
  html, body { margin: 0; background: #F4F5F6; }
  canvas { display: block; }
</style>
<script src="../../lib/qrcode.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, spring, track, springType, hash } from '../../lib/motion.js';

/* ============================================================
   Stellenanzeige als Film. Layout, Maße und Farben sind 1:1 aus
   renderCIHell() des VP-Tools-Generators übernommen; jedes Element
   bekommt nur noch eine Zeit. window.seek(t) ist eine reine Funktion.
   ============================================================ */
// Job-Datei: ?job=jobs/name.js (relativ zu diesem Ordner), sonst ./job.js
await new Promise((res, rej) => { const q = new URLSearchParams(location.search).get('job'); const el = document.createElement('script'); el.src = q || './job.js'; el.onload = res; el.onerror = () => rej(new Error('job file not found: ' + el.src)); document.head.appendChild(el); });
const J = window.JOB;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = window.innerWidth, H = window.innerHeight; c.width = W; c.height = H;
const FF = "'Inter', 'Segoe UI', Arial, sans-serif";
const CI = { bg: '#F4F5F6', ink: '#111418', steel: '#2E6FB2', navy: '#0F3556', steelHi: '#5E9DCD', grau: '#8A8F98',
  fussNavy: '#0B1D33', gruen: '#2E7D32', crimson: '#8B1A3C', gold: '#E8C33C', goldL: '#FBF3D6' };
const B = 60 / (window.JOB.bpm || 120), bt = (n) => n * B;   // Beat-Raster aus job.js

await Promise.all(['400', '600', '700', '800'].map((w) => document.fonts.load(`${w} 40px Inter`)));
const logo = new Image(); logo.src = '../../assets/vp-tools/logo/logo-hell.png';
await new Promise((r) => { logo.onload = r; logo.onerror = r; });

/* ---------- Helfer aus dem Tool ---------- */
function ciRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ciMix(h1, h2, f) { const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; const a = p(h1), b = p(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`; }
function measureLines(text, maxWidth) { const words = text.split(/\s+/); const lines = []; let line = ''; for (const word of words) { const test = line ? line + ' ' + word : word; if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; } else line = test; } if (line) lines.push(line); return lines; }
function capHeight(fs) { const m = ctx.measureText('H'); return (m && m.actualBoundingBoxAscent) ? m.actualBoundingBoxAscent : fs * 0.72; }
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.min(r, Math.max(0, w) / 2, Math.max(0, h) / 2)); };

/* ---------- Layout (einmal, zeitunabhängig) ---------- */
const M = Math.round(W * 0.09), footH = Math.round(H * 0.122), footTop = H - footH;
const isLand = W > H * 1.15, SB = isLand ? Math.round(H * 1.35) : W;
let logoBottom = Math.round(W * 0.045), L = null;
if (logo.naturalWidth) { const ar = logo.naturalHeight / logo.naturalWidth; let lw = Math.round(SB * 0.145), lh = Math.round(lw * ar); const maxLh = Math.round(H * 0.19); if (lh > maxLh) { lh = maxLh; lw = Math.round(lh / ar); } L = { x: Math.round(W * 0.055), y: Math.round(Math.min(W, H) * 0.045), w: lw, h: lh }; logoBottom = L.y + lh; }
const branche = (J.branche || '').split('\n').map((s) => s.trim()).filter(Boolean).join(' ');
const jobRaw = (J.jobtitel || '').trim() || 'Jobtitel', unter = (J.untertitel || '').trim(), region = (J.region || '').trim();
const projNr = (() => { const d = String(J.projektnr || '').replace(/\D/g, ''); return d ? 'VP-' + d : ''; })();
let job = jobRaw, mwd = '(m/w/d)'; const mm = jobRaw.match(/\(\s*m\s*\/\s*w\s*\/\s*[dx](?:\s*\/\s*d)?\s*\)\s*$/i); if (mm) job = jobRaw.slice(0, mm.index).trim() || 'Jobtitel';
const qrUrl = (J.qrUrl || '').trim(), qrAn = !!qrUrl;
const qrQs = Math.round(Math.max(footH * 1.15, W * 0.11, isLand ? H * 0.30 : 0)), qrCapS = Math.max(11, Math.round(qrQs * 0.11)), qrCapH = Math.round(qrCapS * 1.5), qrChh = qrQs + qrCapH;
const qrGrenze = qrAn ? (W - M - qrQs - Math.round(M * 0.4)) : (W - M);
const kickS = Math.max(11, Math.round(SB * 0.022 * ((J.kickerScale || 100) / 100))), subS = Math.max(11, Math.round(SB * 0.024));
const pillS = Math.max(11, Math.round(SB * 0.026 * (Math.min(170, Math.max(60, J.regionSize || 100)) / 100)));
const maxW = (isLand && qrAn) ? (qrGrenze - M) : (W - M * 2), lhF = 1.08;
const nonTitleH = (branche ? kickS * 2.3 : 0) + (unter ? subS * 3.1 : 0) + ((region || projNr) ? pillS * 5.1 : 0);
const minTop = Math.max(Math.round(H * 0.28), logoBottom + Math.round(H * 0.03));
const alarmAn = !!J.alarm, alarmH = alarmAn ? Math.round(H * 0.042) : 0, randUnten = Math.round(H * 0.075) + alarmH;
const availH = footTop - randUnten - minTop;
let titleS = Math.round(SB * 0.155); const minS = Math.max(18, Math.round(SB * 0.06)); let lines = [job];
const splitTwo = (ls) => { if (!isLand && ls.length === 1 && /\s/.test(job)) { const w = job.split(/\s+/), k = Math.ceil(w.length / 2); return [w.slice(0, k).join(' '), w.slice(k).join(' ')]; } return ls; };
while (true) {
  ctx.font = `800 ${titleS}px ${FF}`; lines = splitTwo(measureLines(job, maxW));
  ctx.font = `700 ${Math.round(titleS * 0.42)}px ${FF}`; const mwdW = ctx.measureText(mwd).width; ctx.font = `800 ${titleS}px ${FF}`;
  const fitsW = lines.length <= 3 && lines.every((l) => ctx.measureText(l).width <= maxW) && ctx.measureText(lines[lines.length - 1]).width + titleS * 0.20 + mwdW <= maxW;
  const fitsH = nonTitleH + lines.length * titleS * lhF <= availH;
  if ((fitsW && fitsH) || titleS <= minS) break; titleS -= 4;
}
const ciScale = Math.min(140, Math.max(60, J.titleScale || 100)) / 100;
if (ciScale !== 1) { titleS = Math.max(minS, Math.round(titleS * ciScale)); ctx.font = `800 ${titleS}px ${FF}`; lines = splitTwo(measureLines(job, maxW)); }
const blockH = nonTitleH + lines.length * titleS * lhF;
const yUnten = Math.max(footTop - randUnten - blockH, minTop);
const ciPos = Math.min(100, Math.max(0, J.textY || 0));
const yStart = Math.round(yUnten - (yUnten - minTop) * (ciPos / 100));
const protectTop = yStart - Math.round(H * 0.03);

/* ---------- Motiv vorberechnen (identischer Zufallsverbrauch wie im Tool) ---------- */
const dichte = Math.min(140, Math.max(40, J.dichte || 100)) / 100, fadeBand = H * 0.10;
const TRI = [], PEOPLE = [];
{
  const rnd = ciRng(J.seed || 20260714);
  const fieldAt = (x, y) => { const cx = W * 1.02, cy = -H * 0.06, rx = W * 0.74, ry = H * 0.36; const d = Math.sqrt(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2) / dichte; const wob = (Math.sin(x * 0.011 + y * 0.017) + Math.sin(y * 0.009 - x * 0.006)) * 0.09; return 1 - (d + wob) + (rnd() - 0.5) * 0.16; };
  const fadeAt = (y, r, cc) => { if (y <= protectTop - fadeBand) return 1; const fade = Math.min(1, Math.max(0, (protectTop - y) / fadeBand)); const zh = ((Math.imul(r + 1, 73856093) ^ Math.imul(cc + 7, 19349663)) >>> 0) % 1000 / 1000; return (fade <= 0 || zh > fade) ? -1 : fade; };
  if ((J.motiv || 'dreiecke') === 'menschen') {
    const cell = Math.max(15, Math.round(W / 32)); const rows = Math.ceil((H * 0.42) / cell), cols = Math.ceil(W / cell) + 2;
    for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) {
      const x = cc * cell + (r % 2 ? cell * 0.5 : 0), y = r * cell + cell * 0.5; const t = fieldAt(x, y);
      if (t <= 0.05) { rnd(); rnd(); continue; } if (t < 0.30 && rnd() > t / 0.30) { rnd(); continue; }
      const fade = fadeAt(y, r, cc); if (fade < 0) { rnd(); rnd(); continue; }
      const core = Math.min(1, Math.max(0, (t - 0.35) / 0.55)); const s = cell * (0.52 + 0.34 * core) * (0.92 + rnd() * 0.08); if (s < 5) continue;
      const acc = rnd(); let col, richtig = false;
      if (acc < 0.045) { col = CI.gold; richtig = true; } else if (acc < 0.065) { col = CI.crimson; richtig = true; } else if (acc < 0.085) { col = CI.gruen; richtig = true; }
      else { const f = Math.min(1, Math.max(0, 1 - t)) * 0.75 + rnd() * 0.15; col = (acc < 0.5) ? ciMix(CI.steel, '#B9CFE2', f) : ciMix(CI.navy, '#93ABC1', f * 0.9); }
      PEOPLE.push({ r, cc, x, y, s, t, col, richtig, core, alpha: Math.min(0.95, 0.38 + t * 0.55) * (0.45 + 0.55 * fade) * (richtig ? 1.08 : 1) });
    }
  } else {
    const cell = Math.max(12, Math.round(W / 42)); const colStep = cell * 0.5, rowStep = cell * 0.866;
    const rows = Math.ceil((H * 0.42) / rowStep), cols = Math.ceil(W / colStep) + 2;
    for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) {
      const x = cc * colStep, y = r * rowStep + rowStep * 0.5; const t = fieldAt(x, y);
      if (t <= 0.05) { rnd(); rnd(); continue; } if (t < 0.30 && rnd() > t / 0.30) { rnd(); continue; }
      const s = 0.94 + rnd() * 0.06; const core = Math.min(1, Math.max(0, (t - 0.35) / 0.55));
      let size = Math.min(cell * (0.50 + 0.42 * core) * s, cell * 0.86);
      const fade = fadeAt(y, r, cc); if (fade < 0) { rnd(); rnd(); continue; }
      const acc = rnd(); let col;
      if (acc < 0.02) col = CI.gruen; else if (acc < 0.04) col = CI.crimson; else if (acc < 0.06) col = CI.gold;
      else { const f = Math.min(1, Math.max(0, 1 - t)) * 0.85 + rnd() * 0.15; col = (acc < 0.40) ? ciMix(CI.steelHi, '#EAF1F7', f) : ciMix(CI.navy, '#DCE7F1', f * 0.9); }
      if (size < 1.6) continue;
      TRI.push({ x, y, size, t, col, up: (r + cc) % 2 === 0, alpha: Math.min(0.80, 0.30 + t * 0.60) * (0.4 + 0.6 * fade) });
    }
  }
}
/* ---------- QR vorberechnen ---------- */
let QR = null;
if (qrAn) { try { const q = qrcode(0, 'M'); q.addData(qrUrl); q.make(); const n = q.getModuleCount(); const cell = Math.max(2, Math.floor(qrQs / (n + 8))); const pad = Math.round((qrQs - cell * n) / 2); const mods = []; const finder = (r, cc) => (r < 7 && cc < 7) || (r < 7 && cc >= n - 7) || (r >= n - 7 && cc < 7); for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) mods.push({ r, cc, f: finder(r, cc) }); QR = { n, cell, pad, mods, bx: Math.round(W - M - qrQs), by: Math.round(footTop - qrChh * 0.5) }; } catch (e) { QR = null; } }

/* ============================================================
   FILM „Recruiter in eigener Sache“ – Version 5 (alle Zeiten in Sekunden)
   Hook → Wir suchen: Recruiter (m/w/d) in Ahlen → Die Richtigen werden überall gesucht → Wachstum (Diagramm:
   Balken = größer, beschleunigte Kurve = schneller, Durchbruch der Ziel-Linie = wir wachsen) → Recruiter gesucht!
   → Direktansprache → Was Sie erwartet (Einarbeitung, Weiterentwicklung, seit 1992) → Anzeige → Kontakt-Rätsel
   Lesezeiten: kurze Aussagen ≥ 3 s, lange 4–6 s nach vollständigem Aufbau, Schlussbild ≥ 5 s.
   ============================================================ */
let t = 0;
const ST = J.story, VT = J.vorteile, IN = J.intro, WHITE = '#FFFFFF', LBLUE = '#A9C7E4';
const sp = (t0, k = 170, d = 26) => spring(t - t0, k, d);
const pulse = (t0, k = 260, d = 18) => clamp(spring(t - t0, k, d) - spring(t - t0 - 0.16, k, d));
const typeN = (str, t0, step) => t < t0 ? 0 : Math.min(str.length, Math.floor((t - t0) / step) + 1);
const sstep = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const logoW = new Image(); logoW.src = '../../assets/vp-tools/logo/logo-weiss.png';
await new Promise((r) => { logoW.onload = r; logoW.onerror = r; });

/* ---------- Ablauf ---------- */
const S = {
  aIn: [0.3, 0.9], aLine: 1.5, aOut: 5.0,
  bIn: [5.2, 5.6, 6.1], bOut: 11.0,
  fieldIn: 10.8, cIn: [11.8, 12.4], cross: [12.6, 13.6, 14.6, 15.6], cOut: 17.4, zoom: 17.5, iris: 18.5,
  chart: 18.7, d1: [19.0, 19.5], bars1: 19.4, d1Out: 24.0, d2: 24.3, line: 24.3, d2Out: 28.5, d3: 29.0, lock: 32.3, dOut: 33.0,
  e: 33.5, eIn: [33.8, 34.3], eFill: 35.3, eOut: 38.5,
  f: 39.0, fIn: [39.4, 39.9, 40.4], fOut: 44.5,
  g: 45.0, g1: 45.2, g1In: [45.4, 45.9], g1Out: 50.0, g2: 50.3, g2In: [50.5, 50.9, 51.3, 51.7], g2Out: 57.5, g3: 57.8, g3In: [58.0, 58.4, 58.8], gOut: 63.0,
  ad: 63.5,
};
const T = {   // Anzeige und Ende (Namen wie in der Anzeigen-Vorlage)
  kick: 64.0, title: 64.6, mwd: 65.4, sub: 65.6, pill: 66.0, pillA: 71.0, pillB: 75.0, pillBack: 1e9,
  foot: 66.5, claim: 67.0, dot: 70.0, goldEnd: 76.0,
  adOut: 80.0, eb: 80.5, q1a: 80.8, q1b: 81.3, q1out: 85.5, q2a: 86.0, q2b: 86.6, q2c: 87.1, telHi: 87.6, q2out: 92.5, q3a: 93.0, q3b: 93.6, pix: 94.5,
};
const textZone = { x: M, y: H * 0.63, w: W - 2 * M, h: H * 0.27 };
const fit = (txts, start, weight = 800) => { let s = Math.round(start); ctx.font = `${weight} ${s}px ${FF}`; while (s > 16 && Math.max(...txts.map((x) => ctx.measureText(x).width)) > W - 2 * M) { s -= 2; ctx.font = `${weight} ${s}px ${FF}`; } return s; };

/* ---------- Hintergrund: Kontrastwechsel zwischen den Kapiteln ---------- */
function bgColor() { if (t < 5) return 'navy'; if (t < 33.5) return 'light'; if (t < 39) return 'navy'; if (t < 45) return 'light'; if (t < 63.5) return 'navy'; return 'light'; }
function fillBg(c) { if (c === 'navy') { const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0A1626'); g.addColorStop(0.55, '#0E2A45'); g.addColorStop(1, '#0F3D63'); ctx.fillStyle = g; } else ctx.fillStyle = CI.bg; ctx.fillRect(0, 0, W, H); }
function bounce() { if (t < 5 || t >= S.ad) return 1; return 1 + 0.006 * Math.exp(-(t % 2) * 8); }

/* ---------- Bausteine ---------- */
function figure(x, y, s, col, alpha, filled, lw) {
  const hr = s * 0.26, hx = x, hy = y - s * 0.36, bw = s * 0.88, bh = s * 0.52, bx = x - bw / 2, by = y - s * 0.02;
  ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.strokeStyle = col;
  if (filled) { ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, [bw * 0.5, bw * 0.5, s * 0.10, s * 0.10]); ctx.fill(); }
  else { ctx.lineWidth = lw || Math.max(1.2, s * 0.09); ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, [bw * 0.5, bw * 0.5, s * 0.10, s * 0.10]); ctx.stroke(); }
}
function drawCross(x, y, R, lock, rot, col = CI.navy) {
  const lw = Math.max(2, W * 0.0045);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2, c = Math.cos(a), s = Math.sin(a); ctx.beginPath(); ctx.moveTo(c * R * 0.42, s * R * 0.42); ctx.lineTo(c * R * 1.34, s * R * 1.34); ctx.stroke(); }
  if (lock > 0.01) { const d = R * (1.95 - 0.5 * lock), l = R * 0.42; ctx.strokeStyle = CI.gold; ctx.lineWidth = lw * 1.5;
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { ctx.beginPath(); ctx.moveTo(sx * d, sy * (d - l)); ctx.lineTo(sx * d, sy * d); ctx.lineTo(sx * (d - l), sy * d); ctx.stroke(); } }
  ctx.restore(); ctx.fillStyle = CI.gold; ctx.beginPath(); ctx.arc(x, y, Math.max(3, R * 0.08), 0, Math.PI * 2); ctx.fill();
}
function drawMarked(txt, x, y, color, size, t0) {
  const m = txt.match(/[.?!]$/), body = m ? txt.slice(0, -1) : txt;
  ctx.fillStyle = color; ctx.fillText(body, x, y);
  if (m) { const wdt = ctx.measureText(body).width, d = sp(t0 + 0.35, 300, 20); if (d > 0) { ctx.save(); ctx.fillStyle = CI.gold; ctx.translate(x + wdt + size * 0.03, y); ctx.scale(Math.max(0.001, d), Math.max(0.001, d)); ctx.fillText(m[0], 0, 0); ctx.restore(); } }
}
// Zeilen steigen ruhig maskiert auf (≈0,6 s), Satzzeichen poppen gold. Abgang erst nach der Lesezeit:
// 'crush' (zur Goldlinie), 'up' oder 'left'. Optional: it.after (kleiner Zusatz, z. B. „(m/w/d)“), it.underline.
function typeBlock(items, outT, y0 = textZone.y, exit = 'crush') {
  if (t < items[0].t0 || t > outT + 0.9) return;
  const total = items.reduce((a, it) => a + it.size * 1.08, 0), zc = y0 + total / 2;
  const ex = t >= outT ? (exit === 'crush' ? spring(t - outT, 220, 30) : springType(t - outT, 200)) : 0;
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (exit === 'crush') { ctx.translate(0, zc); ctx.scale(1, Math.max(0.0001, 1 - ex)); ctx.translate(0, -zc); }
  else if (exit === 'up') ctx.translate(0, -ex * (zc + total));
  else if (exit === 'left') ctx.translate(-ex * W * 1.25, 0);
  let y = y0;
  for (const it of items) {
    y += it.size; const s = springType(t - it.t0, it.k || 120);
    if (s > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, y - it.size * 1.05, W, it.size * 1.4); ctx.clip(); const sc = 1 + 0.06 * (1 - s); ctx.translate(M, y + (1 - s) * it.size * 1.1); ctx.scale(sc, sc);
      ctx.font = `${it.weight || 800} ${it.size}px ${FF}`; ctx.letterSpacing = `${-(it.size * 0.02).toFixed(1)}px`; drawMarked(it.txt, 0, 0, it.color, it.size, it.t0);
      const mw = ctx.measureText(it.txt).width; ctx.letterSpacing = '0px';
      if (it.after) { ctx.font = `700 ${it.after.size}px ${FF}`; ctx.fillStyle = it.after.color; ctx.fillText(it.after.txt, mw + it.size * 0.16, 0); }
      if (it.underline) { const u = clamp(springType(t - (it.t0 + 0.6), 110)); ctx.fillStyle = CI.gold; ctx.fillRect(0, it.size * 0.16, mw * u, Math.max(5, it.size * 0.06)); }
      ctx.restore(); }
    y += it.size * 0.08;
  }
  ctx.restore();
  if (exit === 'crush' && t >= outT) { const lw = (W - 2 * M) * ex * (1 - sstep((t - outT - 0.35) / 0.3)); ctx.fillStyle = CI.gold; ctx.fillRect(W / 2 - lw / 2, zc - 4, lw, 8); }
}
// Eyebrow: Goldstrich + gesperrte Versalien, tippen sich ein, gehen mit dem Block (Quetschen)
function eyebrow(txt, y, size, t0, col, outT = Infinity) {
  if (t < t0 || t > outT + 0.9) return; const ex = t >= outT ? spring(t - outT, 220, 30) : 0;
  ctx.save(); ctx.translate(0, y); ctx.scale(1, Math.max(0.0001, 1 - ex)); ctx.translate(0, -y);
  ctx.font = `700 ${size}px ${FF}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const kbH = Math.max(3, size * 0.26), kbW = size * 1.7; ctx.fillStyle = CI.gold; rr(M, y - size * 0.36 - kbH / 2, kbW * clamp(sp(t0, 220, 24)), kbH, kbH / 2); ctx.fill();
  const T2 = txt.toUpperCase(), n = typeN(T2, t0 + 0.15, 0.04); let x = M + kbW + size * 0.6; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { ctx.fillText(T2[i], x, y); x += ctx.measureText(T2[i]).width + size * 0.34; }
  ctx.restore();
}

/* ---------- A Hook (Marine) ---------- */
const hq = J.hook1.split('|').map((s) => s.trim()), hookS = fit(hq, SB * 0.17), hookY = H * 0.5 - hookS * 1.15;

  const P = [[-0.5, 0.42], [-0.16, 0.12], [0.14, 0.0], [0.48, -0.42]].map(([x, y]) => [x * IC, y * IC]), seg = []; let tot = 0;
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(l); tot += l; }
  const pr = clamp(springType(t - S.g2, 22)) * tot; ctx.strokeStyle = WHITE; ctx.lineWidth = IC * 0.035; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  let acc = 0, tip = P[0], ang = 0; for (let i = 1; i < P.length; i++) { const l = seg[i - 1]; ang = Math.atan2(P[i][1] - P[i - 1][1], P[i][0] - P[i - 1][0]); if (pr >= acc + l) { ctx.lineTo(P[i][0], P[i][1]); tip = P[i]; acc += l; } else { const f = (pr - acc) / l; tip = [lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]; ctx.lineTo(tip[0], tip[1]); break; } }
  ctx.stroke();
  [1, 2].forEach((k) => { const reach = seg.slice(0, k).reduce((a, b) => a + b, 0); if (pr < reach) return; const s = clamp(sp(S.g2 + 0.05 + k * 0.25, 260, 16)); ctx.fillStyle = '#1D4B78'; ctx.beginPath(); ctx.arc(P[k][0], P[k][1], IC * 0.075 * s, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = IC * 0.022; ctx.strokeStyle = WHITE; ctx.stroke(); ctx.fillStyle = CI.gold; ctx.beginPath(); ctx.arc(P[k][0], P[k][1], IC * 0.03 * s, 0, Math.PI * 2); ctx.fill(); });
  const a = clamp(sp(S.g2 + 1.0, 220, 18)); if (a > 0 && pr > tot * 0.97) { const s = IC * 0.11 * a; ctx.save(); ctx.translate(P[3][0], P[3][1]); ctx.rotate(ang); ctx.fillStyle = CI.gold; ctx.beginPath(); ctx.moveTo(s * 0.9, 0); ctx.lineTo(-s * 0.6, -s * 0.7); ctx.lineTo(-s * 0.6, s * 0.7); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
// G3 seit 1992: Zeitstrahl von 1992 bis heute, ein Strich pro Jahr
function drawG3Icon() {
  if (t < S.g3 || t > S.gOut + 0.6) return; const o = outS(S.gOut); if (o > 0.999) return;

  const x0 = M + IC * 0.06, x1 = W - M - IC * 0.06, y = ICY + IC * 0.12, pr = clamp(springType(t - (S.g3 + 0.2), 28)), yrs = 2026 - 1992;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(3, IC * 0.016); ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, pr), y); ctx.stroke();
  for (let k = 0; k <= yrs; k++) { const f = k / yrs; if (f > pr) break; const big = k % 10 === 8 || k === 0; ctx.strokeStyle = big ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(2, IC * 0.008); ctx.beginPath(); ctx.moveTo(lerp(x0, x1, f), y - IC * (big ? 0.07 : 0.04)); ctx.lineTo(lerp(x0, x1, f), y); ctx.stroke(); }
  const d0 = clamp(sp(S.g3 + 0.2, 240, 16)); ctx.fillStyle = CI.gold; ctx.beginPath(); ctx.arc(x0, y, IC * 0.05 * d0, 0, Math.PI * 2); ctx.fill();
  ctx.font = `800 ${Math.round(IC * 0.2)}px ${FF}`; ctx.letterSpacing = `${-(IC * 0.004).toFixed(1)}px`; ctx.fillStyle = CI.gold; ctx.globalAlpha = clamp(sp(S.g3 + 0.3, 200, 20)); ctx.fillText('1992', x0 - IC * 0.02, y - IC * 0.14); ctx.letterSpacing = '0px';
  if (pr > 0.97) { const d1 = clamp(sp(S.g3 + 1.4, 240, 16)); ctx.globalAlpha = 1; ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(x1, y, IC * 0.04 * d1, 0, Math.PI * 2); ctx.fill(); ctx.font = `700 ${Math.round(IC * 0.09)}px ${FF}`; ctx.textAlign = 'right'; ctx.fillStyle = LBLUE; ctx.globalAlpha = d1; ctx.fillText('heute', x1, y - IC * 0.12); ctx.textAlign = 'left'; }
  ctx.globalAlpha = 1; ctx.restore();
}

/* ---------- Logo: Hell auf hellen, Weiß auf dunklen Szenen ---------- */
function drawLogoStory() {
  if (!L || t < S.aOut || t >= S.ad) return; const s = sp(S.aOut + 0.2, 160, 20), dark = bgColor() === 'navy', img = dark ? logoW : logo;
  const lw = dark ? L.h * (logoW.naturalWidth / logoW.naturalHeight || 1) : L.w;
  ctx.save(); ctx.translate(-(1 - clamp(s)) * (L.x + lw), 0); ctx.drawImage(img, L.x, L.y, lw, L.h); ctx.restore();

function drawLogoAd() { if (!L || t < S.ad) return; const s = sp(S.ad + 0.2, 160, 18); if (s <= 0) return; ctx.save(); ctx.translate(L.x + L.w / 2, L.y + L.h / 2); ctx.scale(0.5 + 0.5 * Math.min(1.06, s), 0.5 + 0.5 * Math.min(1.06, s)); ctx.drawImage(logo, -L.w / 2, -L.h / 2, L.w, L.h); ctx.restore(); }

/* ---------- Anzeige: Menschen-Motiv rauscht ein ---------- */
const motifGoldEnd = PEOPLE.length ? PEOPLE[Math.floor(PEOPLE.length * 0.55)] : null;
function drawMotivAd() {
  if (t < S.ad) return;
  for (const p of PEOPLE) { const s = sp(S.ad + (1 - clamp(p.t)) * 0.6 + (p.y / H) * 0.4, 180, 20); if (s <= 0.001) continue;
    const eg = p === motifGoldEnd && t >= T.goldEnd ? clamp(sp(T.goldEnd, 180, 16)) : 0;
    figure(p.x, p.y, p.s * Math.min(1.1, s) * (1 + 0.4 * eg), eg > 0 ? CI.gold : p.col, eg > 0 ? 1 : p.alpha * clamp(s), eg > 0 || p.richtig || p.core > 0.30); }
  ctx.globalAlpha = 1;
}

/* ---------- Ende: Anzeigenblock quetscht sich weg, Fragen und Antworten, Rufnummer ausgepixelt ---------- */
function drawAdWrapped() {
  if (t > T.adOut + 0.8) return;
  if (t < T.adOut) { drawAd(); return; }
  const crush = spring(t - T.adOut, 250, 32), zc = yStart + blockH / 2;
  ctx.save(); ctx.translate(0, zc); ctx.scale(1, Math.max(0.0001, 1 - crush)); ctx.translate(0, -zc); drawAd(); ctx.restore();
  const lw = (W - 2 * M) * crush * (1 - sstep((t - T.adOut - 0.35) / 0.3)); ctx.fillStyle = CI.gold; ctx.fillRect(W / 2 - lw / 2, zc - 4, lw, 8);
}
const EN = J.ende;
const ebH = kickS * 2.3, endAvail = footTop - Math.round(H * 0.05) - yStart;
let endS = fit([...EN.q1, ...EN.q2, EN.q3[0]], SB * 0.085); endS = Math.max(16, Math.min(endS, Math.floor((endAvail - ebH) / (3 * 1.12))));
let finS = fit([EN.q3[1]], SB * 0.14); finS = Math.max(16, Math.min(finS, Math.floor((endAvail - ebH - endS * 1.12) / 1.12)));
let ebS = kickS; { const kw = (s) => { ctx.font = `700 ${s}px ${FF}`; let w = s * 1.7 + s * 0.6; for (const ch of EN.eyebrow.toUpperCase()) w += ctx.measureText(ch).width + s * 0.34; return w; }; while (ebS > 10 && kw(ebS) > W - 2 * M) ebS -= 1; }
function drawEnd() {
  if (t < T.eb) return;
  const y = yStart + kickS; ctx.font = `700 ${ebS}px ${FF}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const kbH = Math.max(3, ebS * 0.26), kbW = ebS * 1.7; ctx.fillStyle = CI.gold; rr(M, y - ebS * 0.36 - kbH / 2, kbW * clamp(sp(T.eb, 220, 24)), kbH, kbH / 2); ctx.fill();
  const txt = EN.eyebrow.toUpperCase(), n = typeN(txt, T.eb + 0.15, 0.035); let x = M + kbW + ebS * 0.6; ctx.fillStyle = CI.navy;
  for (let i = 0; i < n; i++) { const pop = sp(T.eb + 0.15 + i * 0.035, 300, 22); ctx.save(); ctx.globalAlpha = clamp(pop * 2); ctx.translate(x, y + (1 - clamp(pop)) * ebS * 0.4); ctx.fillText(txt[i], 0, 0); ctx.restore(); x += ctx.measureText(txt[i]).width + ebS * 0.34; }
  const y0 = yStart + ebH;
  typeBlock([{ txt: EN.q1[0], size: endS, color: CI.ink, t0: T.q1a }, { txt: EN.q1[1], size: endS, color: CI.navy, t0: T.q1b }], T.q1out, y0);
  typeBlock([{ txt: EN.q2[0], size: endS, color: CI.ink, t0: T.q2a }, { txt: EN.q2[1], size: endS, color: CI.navy, t0: T.q2b }, { txt: EN.q2[2], size: endS, color: CI.navy, t0: T.q2c }], T.q2out, y0);
  typeBlock([{ txt: EN.q3[0], size: endS, color: CI.ink, t0: T.q3a }, { txt: EN.q3[1], size: finS, color: CI.navy, t0: T.q3b }], Infinity, y0);
}
// Rufnummer im Fußband: erst gold hervorgehoben, dann in Stufen zu goldenen Pixelblöcken
function drawPixel() {
  if (t < T.pix) return;
  const fuss2 = Math.max(11, Math.round(SB * 0.017)), tel = (J.telefon || '').trim(), k = tel.search(/\d/); if (k < 0) return;
  ctx.font = `700 ${fuss2}px ${FF}`;   // Nummer ist ab telHi fett und gold
  const x0 = Math.floor(M + ctx.measureText(tel.slice(0, k)).width) - 2, w = Math.ceil(ctx.measureText(tel.slice(k)).width) + 8;
  const yb = footTop + footH * 0.82, y0 = Math.floor(yb - fuss2 * 1.0), h = Math.ceil(fuss2 * 1.3);
  const steps = [2, 3, 5, 8, 11, 14].map((v) => Math.max(2, Math.round(v * fuss2 / 18)));
  const bs = steps[Math.min(steps.length - 1, Math.floor((t - T.pix) / 0.0625))];
  const img = ctx.getImageData(x0, y0, w, h), d = img.data;
  for (let by = 0; by < h; by += bs) for (let bx = 0; bx < w; bx += bs) {
    let r = 0, g = 0, b = 0, n = 0, hit = 0;
    for (let yy = by; yy < Math.min(h, by + bs); yy++) for (let xx = bx; xx < Math.min(w, bx + bs); xx++) { const i = (yy * w + xx) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; if (d[i] > 140 && d[i + 1] > 110) hit++; }
    const cov = hit / n;
    if (cov > 0.04) { ctx.globalAlpha = Math.min(1, 0.6 + cov * 2); ctx.fillStyle = CI.gold; } else { ctx.globalAlpha = 1; ctx.fillStyle = `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`; }
    ctx.fillRect(x0 + bx, y0 + by, Math.min(bs, w - bx), Math.min(bs, h - by));

}

/* ---------- Anzeigenblock (Mechanik der Stellenanzeigen-Vorlage) ---------- */
function drawAd() {
  if (t < T.kick) return;
  let y = yStart;
  if (branche) {
    y += kickS; ctx.font = `700 ${kickS}px ${FF}`; const kbH = Math.max(3, kickS * 0.26), kbW = kickS * 1.7; const sw = sp(T.kick, 220, 24);
    ctx.fillStyle = CI.gold; rr(M, y - kickS * 0.36 - kbH / 2, kbW * clamp(sw), kbH, kbH / 2); ctx.fill();
    ctx.fillStyle = CI.navy; let x = M + kbW + kickS * 0.6; const txt = branche.toUpperCase(); const n = typeN(txt, T.kick + 0.15, 0.05);
    for (let i = 0; i < n; i++) { const ch = txt[i]; const pop = sp(T.kick + 0.15 + i * 0.05, 300, 22); ctx.save(); ctx.globalAlpha = clamp(pop * 2); ctx.translate(x, y + (1 - clamp(pop)) * kickS * 0.4); ctx.fillText(ch, 0, 0); ctx.restore(); x += ctx.measureText(ch).width + kickS * 0.34; }

  }
  ctx.font = `800 ${titleS}px ${FF}`; ctx.textBaseline = 'alphabetic'; y += titleS * 0.82;
  const grad = (x0, w) => { const g = ctx.createLinearGradient(x0, 0, x0 + Math.max(w, 1), 0); g.addColorStop(0, CI.navy); g.addColorStop(1, CI.steel); return g; };
  const drawMwd = (x, yy) => { const s = sp(T.mwd, 260, 22); if (s <= 0) return; ctx.save(); ctx.font = `700 ${Math.round(titleS * 0.42)}px ${FF}`; ctx.fillStyle = '#8A93A0'; ctx.translate(x, yy); ctx.scale(Math.max(0.001, s), Math.max(0.001, s)); ctx.fillText(mwd, 0, 0); ctx.restore(); };
  const lineIn = (i, draw) => { const s = springType(t - (T.title + i * 0.3), 90); if (s <= 0) return; const yy = y + i * titleS * lhF; ctx.save(); ctx.beginPath(); ctx.rect(0, yy - titleS * 1.05, W, titleS * 1.35); ctx.clip(); ctx.translate(0, (1 - s) * titleS * 1.2); draw(yy); ctx.restore(); };
  if (lines.length === 1) {
    const words = lines[0].split(/\s+/);
    lineIn(0, (yy) => { if (words.length > 1) { const first = words[0] + ' ', rest = words.slice(1).join(' '); const fw = ctx.measureText(first).width, rw = ctx.measureText(rest).width; ctx.fillStyle = CI.ink; ctx.fillText(first, M, yy); ctx.fillStyle = grad(M + fw, rw); ctx.fillText(rest, M + fw, yy); } else { const lw = ctx.measureText(lines[0]).width; ctx.fillStyle = grad(M, lw); ctx.fillText(lines[0], M, yy); } });
    drawMwd(M + ctx.measureText(lines[0]).width + titleS * 0.20, y);
  } else {
    lines.forEach((ln, i) => lineIn(i, (yy) => { const lw = ctx.measureText(ln).width; ctx.fillStyle = (i === 0) ? CI.ink : grad(M, lw); ctx.fillText(ln, M, yy); }));
    const last = lines.length - 1; drawMwd(M + ctx.measureText(lines[last]).width + titleS * 0.20, y + last * titleS * lhF);
  }
  y += (lines.length - 1) * titleS * lhF;
  if (unter) { y += subS * 2.9; let subS2 = subS; ctx.font = `400 ${subS2}px ${FF}`; while (subS2 > 10 && ctx.measureText(unter).width > qrGrenze - M) { subS2 -= 1; ctx.font = `400 ${subS2}px ${FF}`; } ctx.fillStyle = CI.grau; ctx.fillText(unter.slice(0, typeN(unter, T.sub, 0.016)), M, y); }
  // Region-Pille: ein Container, vier Zustände
  if (region) {
    y += pillS * 4.4; let pillS2 = pillS; ctx.font = `700 ${pillS2}px ${FF}`;
    const states = [region, J.pille[0], J.pille[1], region]; const times = [T.pill, T.pillA, T.pillB, T.pillBack];
    const widths = states.map((s) => ctx.measureText(s).width + pillS2 * 1.15 * 2);
    const capH = capHeight(pillS2), padX = pillS2 * 1.15, padY = pillS2 * 0.62, ph = capH + padY * 2, pt = y - ph;
    const grow = sp(T.pill, 160, 20); if (grow > 0) {
      const w = lerp(ph, track(t, times.map((tt, i) => [tt, widths[i]]), 140, 19), clamp(grow));
      let idx = 0; for (let i = 1; i < times.length; i++) if (t >= times[i] + 0.22) idx = i;
      const goldness = track(t, [[0, 0], [T.pillA, 1], [T.pillBack, 0]], 140, 19) > 0.5;
      rr(M, pt, w, ph, ph / 2); ctx.fillStyle = goldness ? CI.goldL : '#FFFFFF'; ctx.fill(); ctx.lineWidth = Math.max(1.5, W * 0.0016); ctx.strokeStyle = goldness ? CI.goldL : '#D6DCE4'; ctx.stroke();
      let txt = clamp(sp(T.pill + 0.18, 200, 24)), slide = 0;
      for (let i = 1; i < times.length; i++) { const since = t - times[i]; if (since >= 0 && since < 0.22) slide = clamp(since / 0.22); else if (since >= 0.22 && since < 0.6) txt = Math.min(txt, clamp(springType(since - 0.22, 160))); }
      if (txt > 0) { ctx.save(); ctx.beginPath(); rr(M, pt, w, ph, ph / 2); ctx.clip(); ctx.fillStyle = CI.navy; ctx.globalAlpha = Math.min(1, txt * 1.5); ctx.fillText(states[idx], M + padX, pt + ph / 2 + capH / 2 + (1 - txt) * -capH * 0.9 + slide * capH * 1.6); ctx.restore(); }
    }
  }
}
function drawFoot() {

  const top = footTop + (1 - rise) * footH; ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, footH); ctx.clip();
  const g = ctx.createLinearGradient(0, footTop, W, footTop + footH); g.addColorStop(0, '#0A1626'); g.addColorStop(0.55, '#0E2A45'); g.addColorStop(1, '#0F3D63'); ctx.fillStyle = g; ctx.fillRect(0, footTop, W, footH);
  const fuss1 = Math.max(13, Math.round(SB * 0.021)), fuss2 = Math.max(11, Math.round(SB * 0.017)); const web = (J.web || 'voss-partner.de').trim(), tel = (J.telefon || '').trim(), zusatz = (J.fusszusatz || '').trim();
  const row = (txt, x, yy, font, color, t0) => { const s = springType(t - t0, 120); if (s <= 0) return; ctx.font = font; ctx.fillStyle = color; ctx.save(); ctx.globalAlpha = Math.min(1, s * 1.4); ctx.fillText(txt, x, yy + (1 - s) * fuss2 * 0.8); ctx.restore(); };
  row(web, M, footTop + footH * 0.38, `700 ${fuss1}px ${FF}`, '#FFFFFF', T.foot + 0.2);
  row('Ahlen · Stuttgart', M, footTop + footH * 0.60, `400 ${fuss2}px ${FF}`, 'rgba(255,255,255,.55)', T.foot + 0.3);
  if (tel) row(tel, M, footTop + footH * 0.82, `${t >= T.telHi ? 700 : 400} ${fuss2}px ${FF}`, t >= T.telHi ? CI.gold : 'rgba(255,255,255,.55)', T.foot + 0.4);
  if (J.claim) {
    ctx.font = `700 ${fuss1}px ${FF}`; const wClaim1 = ctx.measureText('Wir finden die Richtigen.').width; ctx.font = `400 ${fuss2}px ${FF}`;
    const wClaim = Math.max(wClaim1, ctx.measureText('Personalberatung seit 1992.').width, zusatz ? ctx.measureText(zusatz).width : 0);
    const claimLinks = W - M - wClaim;
    row('Wir finden die Richtigen', claimLinks, footTop + footH * 0.38, `700 ${fuss1}px ${FF}`, '#FFFFFF', T.claim);
    ctx.font = `700 ${fuss1}px ${FF}`; const dotX = claimLinks + ctx.measureText('Wir finden die Richtigen').width;
    const dot = sp(T.claim + 0.35, 320, 20); if (dot > 0) { const pp = 1 + 0.35 * pulse(T.dot, 240, 16); ctx.save(); ctx.fillStyle = CI.gold; ctx.translate(dotX + fuss1 * 0.12, footTop + footH * 0.38 - fuss1 * 0.08); ctx.scale(Math.max(0.001, dot) * pp, Math.max(0.001, dot) * pp); ctx.fillText('.', -fuss1 * 0.12, fuss1 * 0.08); ctx.restore(); }
    row('Personalberatung seit 1992.', claimLinks, footTop + footH * 0.60, `400 ${fuss2}px ${FF}`, 'rgba(255,255,255,.55)', T.claim + 0.1);
    if (zusatz) row(zusatz, claimLinks, footTop + footH * 0.82, `400 ${fuss2}px ${FF}`, 'rgba(255,255,255,.55)', T.claim + 0.2);
  }
  ctx.restore();
}

window.seek = (tt) => {
  t = tt; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.setLineDash([]); ctx.letterSpacing = '0px';
  fillBg(bgColor());
  if (t < S.ad) {
    const bz = bounce(); ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(bz, bz); ctx.translate(-W / 2, -H / 2);
    if (t >= S.fieldIn && t < S.iris) { const c = camC(); ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(c.z, c.z); ctx.translate(-W / 2 - c.ox, -H / 2 - c.oy); drawField(); ctx.restore(); }
    drawChart(); drawEFig(); drawG1Icon(); drawG2Icon(); drawG3Icon();
    drawA(); drawB(); drawCText(); drawDText(); drawEText(); drawF(); drawGText();
    ctx.restore();
    drawLogoStory(); drawGoldFlash(); drawIris();
  } else { drawMotivAd(); drawLogoAd(); drawAdWrapped(); drawEnd(); drawFoot(); drawPixel(); }
};
window.seek(0);
