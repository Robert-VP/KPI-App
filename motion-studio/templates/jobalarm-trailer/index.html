<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Job-Alarm Trailer</title>
<style>
  @font-face { font-family: 'Kanit'; font-weight: 500; src: url('../jobalarm-gta/fonts/Kanit-500.woff2'); }
  @font-face { font-family: 'Kanit'; font-weight: 700; src: url('../jobalarm-gta/fonts/Kanit-700.woff2'); }
  @font-face { font-family: 'Kanit'; font-weight: 900; src: url('../jobalarm-gta/fonts/Kanit-900.woff2'); }
  @font-face { font-family: 'Kanit'; font-style: italic; font-weight: 900; src: url('../jobalarm-gta/fonts/Kanit-900i.woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, spring, hash } from '../../lib/motion.js';
import { SHOTS, T, TXT, DUR, BAR } from './timeline.mjs';

/* ============================================================
   Job-Alarm-Trailer im Stil der GTA-VI-Trailer: Kinobild-Band mit Ausschnitten aus den Plakaten (unscharf hinterlegt),
   Filmkorn, Schnitte auf den Takt, Untertitel, Minikarte und Missions-Text, Spiel-Handy, Titelkarte, Schlusskarte.
   window.seek(t) ist eine reine Funktion der Zeit.
   ============================================================ */
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = window.innerWidth, H = window.innerHeight; c.width = W; c.height = H;
const U = W / 1080, V = H / 1920, PINK = '#ff3fb4', GOLD = '#ffd23f';
const BY = 580 * V, BH = 760 * V;   // Kinobild-Band
let t = 0;
const sp = (t0, k = 170, d = 20) => spring(t - t0, k, d);
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const IMG = [null, new Image(), new Image(), new Image()]; [1, 2, 3].forEach((i) => { IMG[i].src = `plakat${i}.png`; });
const GRAIN = [0, 1, 2].map((k) => { const g = document.createElement('canvas'); g.width = 270; g.height = 480; const x = g.getContext('2d'), d = x.createImageData(270, 480);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * 0.37 + k * 999) - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return g; });

function text(str, x, y, w, px, fill, align = 'center', ls = 0, style = 'normal') { ctx.font = `${style} ${w} ${px}px "Kanit"`; ctx.letterSpacing = `${ls}px`; ctx.textAlign = align; ctx.fillStyle = fill; ctx.fillText(str, x, y); ctx.letterSpacing = '0px'; ctx.textAlign = 'left'; }
function shadowText(str, x, y, w, px, fill, align = 'center', ls = 0) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 10 * U; ctx.shadowOffsetY = 3 * U; text(str, x, y, w, px, fill, align, ls); ctx.restore(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// Einstellung: Ausschnitt eines Plakats im Band, darunter derselbe Ausschnitt unscharf und dunkel bildfüllend
function shot(s, a = 1) {
  const [t0, t1, pi, cx, cy, w, zm, pan] = s, img = IMG[pi], u = clamp((t - t0) / (t1 - t0)), z = 1 + zm * u, cw = w / z, ch = cw * BH / W, x = cx + pan * (u - 0.5) - cw / 2, y = cy - ch / 2;
  ctx.save(); ctx.globalAlpha = a; ctx.filter = 'blur(30px) brightness(0.34) saturate(1.3)'; const bw = cw * 1.25, bh = bw * H / W; ctx.drawImage(img, cx - bw / 2, cy - bh / 2, bw, bh, -40, -40, W + 80, H + 80); ctx.filter = 'none';
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, x, y, cw, ch, 0, BY, W, BH);
  const fl = Math.max(0, 1 - (t - t0) / 0.14); if (fl > 0 && t0 > T.drop - 0.01) { ctx.fillStyle = `rgba(255,235,245,${0.35 * fl})`; ctx.fillRect(0, BY, W, BH); }
  ctx.restore();
}
function minimap(a) {   // Minimap unten links im Band, Route zum Job
  if (a <= 0) return; const cx = 150 * U, cy = BY + BH - 150 * U, r = 112 * U; ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(cx, cy, r + 8 * U, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = '#16233a'; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  const rot = t * 0.08; ctx.translate(cx, cy); ctx.rotate(rot); ctx.fillStyle = '#1f4f7a'; ctx.fillRect(-r * 1.5, r * 0.25, r * 3, r * 2);
  ctx.strokeStyle = '#5d6b80'; ctx.lineWidth = 6 * U; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 46 * U, -r * 1.6); ctx.lineTo(i * 46 * U + 20 * U, r * 0.25); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r * 1.6, i * 40 * U); ctx.lineTo(r * 1.6, i * 40 * U - 14 * U); ctx.stroke(); }
  ctx.strokeStyle = PINK; ctx.lineWidth = 9 * U; ctx.lineCap = 'round'; ctx.setLineDash([16 * U, 10 * U]); ctx.lineDashOffset = -t * 60 * U; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -40 * U); ctx.lineTo(46 * U, -54 * U); ctx.lineTo(92 * U, -150 * U); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  const bx = cx + 70 * U, by = cy - 74 * U, bp = 1 + 0.15 * Math.sin(t * 8); ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(bx, by, 15 * U * bp, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 3 * U; ctx.stroke(); text('!', bx, by + 9 * U, 900, 26 * U, '#000');
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(cx, cy - 16 * U); ctx.lineTo(cx + 12 * U, cy + 12 * U); ctx.lineTo(cx, cy + 5 * U); ctx.lineTo(cx - 12 * U, cy + 12 * U); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3 * U; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#5fd35f'; ctx.fillRect(cx - r, cy + r + 18 * U, r * 1.3, 8 * U); ctx.fillStyle = '#4aa3ff'; ctx.fillRect(cx - r + r * 1.35, cy + r + 18 * U, r * 0.65, 8 * U);
  ctx.restore();
}
function phone() {   // Spiel-Handy mit Job-Alarm-Mail
  const [p0] = T.phone, q = sp(p0, 160, 18); ctx.save(); ctx.filter = 'blur(22px) brightness(0.5)'; ctx.drawImage(IMG[2], 0, 1100, 941, 572, -60, -60, W + 120, H + 120); ctx.filter = 'none';
  const pw = 600 * U, ph = 1180 * U, px = W / 2 - pw / 2, py = H / 2 - ph / 2 + (1 - q) * 500 * U; ctx.translate(W / 2, py + ph / 2); ctx.rotate(-0.04 * (1 - q)); ctx.translate(-W / 2, -(py + ph / 2));
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 60 * U; ctx.fillStyle = '#0c0c10'; rr(px, py, pw, ph, 70 * U); ctx.fill(); ctx.shadowBlur = 0;
  const sx = px + 22 * U, sy = py + 22 * U, sw = pw - 44 * U, sh = ph - 44 * U; ctx.save(); rr(sx, sy, sw, sh, 52 * U); ctx.clip();
  { const wh = sh, ww = wh * 941 / 1672; ctx.drawImage(IMG[3], W / 2 - ww / 2, sy, ww, wh); } ctx.fillStyle = 'rgba(10,0,20,0.35)'; ctx.fillRect(sx, sy, sw, sh);
  text('21:47', W / 2, sy + 230 * U, 500, 130 * U, '#ffffff'); text('Mittwoch', W / 2, sy + 110 * U, 500, 30 * U, 'rgba(255,255,255,0.85)');
  const nq = sp(T.notif, 220, 18); if (nq > 0) { const ny = sy + 330 * U + (1 - nq) * -120 * U; ctx.globalAlpha = clamp(nq * 2); ctx.fillStyle = 'rgba(245,240,250,0.94)'; rr(sx + 22 * U, ny, sw - 44 * U, 200 * U, 30 * U); ctx.fill();
    ctx.fillStyle = PINK; rr(sx + 44 * U, ny + 26 * U, 64 * U, 64 * U, 16 * U); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * U; rr(sx + 56 * U, ny + 44 * U, 40 * U, 28 * U, 3 * U); ctx.stroke(); ctx.beginPath(); ctx.moveTo(sx + 56 * U, ny + 46 * U); ctx.lineTo(sx + 76 * U, ny + 60 * U); ctx.lineTo(sx + 96 * U, ny + 46 * U); ctx.stroke();
    text(TXT.notif[0], sx + 126 * U, ny + 54 * U, 700, 26 * U, '#1a0a26', 'left'); text('jetzt', sx + sw - 44 * U, ny + 54 * U, 500, 22 * U, '#7a6a88', 'right');
    text(TXT.notif[1], sx + 44 * U, ny + 128 * U, 500, 25 * U, '#1a0a26', 'left'); text(TXT.notif[2], sx + 44 * U, ny + 166 * U, 500, 23 * U, '#6a4a80', 'left'); }
  text('Zum Öffnen nach oben wischen', W / 2, sy + sh - 60 * U, 500, 24 * U, 'rgba(255,255,255,0.8)'); ctx.fillStyle = 'rgba(255,255,255,0.85)'; rr(W / 2 - 70 * U, sy + sh - 34 * U, 140 * U, 8 * U, 4 * U); ctx.fill();
  ctx.restore(); ctx.restore();
  const pa = sp(T.passed, 260, 18); if (pa > 0) { ctx.save(); const fade = 1 - clamp((t - (T.phone[1] - 0.25)) / 0.25); ctx.globalAlpha = clamp(pa * 2) * fade;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, H / 2 - 190 * U, W, 380 * U);
    ctx.translate(W / 2, H / 2); const k = 1.6 - 0.6 * Math.min(1, pa); ctx.scale(k, k);
    TXT.passed.forEach((l, i) => { ctx.font = `italic 900 ${118 * U}px "Kanit"`; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 14 * U; ctx.strokeStyle = '#000'; const y = (i ? 70 : -40) * U; ctx.strokeText(l, 0, y);
      const g = ctx.createLinearGradient(0, y - 90 * U, 0, y); g.addColorStop(0, '#fff3b0'); g.addColorStop(0.55, GOLD); g.addColorStop(1, '#e89a1a'); ctx.fillStyle = g; ctx.fillText(l, 0, y); });
    ctx.textAlign = 'left'; ctx.restore(); }
}
function pros() {   // drei Vorteile, je ein Schlag
  T.pros.forEach((p0, i) => { const p1 = i < 2 ? T.pros[i + 1] : T.tag[0] - 0.3; if (t < p0 || t >= p1) return; const q = sp(p0, 300, 18), [a, b2] = TXT.pros[i];
    ctx.save(); ctx.translate(W / 2, BY + BH + 150 * U); const k = 1.25 - 0.25 * Math.min(1, q); ctx.scale(k, k); ctx.globalAlpha = clamp(q * 3);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 16 * U; text(a, 0, 0, 900, 78 * U, '#ffffff'); text(b2, 0, 92 * U, 900, 78 * U, PINK); ctx.restore(); ctx.restore(); });
}
function titleCard() {
  const u = t - T.title, g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07010e'); g.addColorStop(0.6, '#1d0730'); g.addColorStop(1, '#7a2260'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, H * 0.5); glow.addColorStop(0, 'rgba(255,170,120,0.55)'); glow.addColorStop(1, 'rgba(255,120,160,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const k = 1.1 - 0.1 * ease(u / (BAR * 0.9)), a = clamp(u / 0.25); ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * 0.5); ctx.scale(k, k);
  text(TXT.over, 0, -150 * U, 700, 40 * U, 'rgba(255,255,255,0.92)', 'center', 14 * U);
  let tp = 200 * U; ctx.font = `900 ${tp}px "Kanit"`; while (ctx.measureText(TXT.title).width > W * 0.84) { tp -= 2; ctx.font = `900 ${tp}px "Kanit"`; } ctx.textAlign = 'center'; const tg = ctx.createLinearGradient(0, -110 * U, 0, 60 * U); tg.addColorStop(0, '#ffe08a'); tg.addColorStop(0.45, '#ff8fb8'); tg.addColorStop(1, '#a77dff');
  ctx.save(); ctx.shadowColor = 'rgba(255,120,190,0.9)'; ctx.shadowBlur = 70 * U; ctx.fillStyle = tg; ctx.fillText(TXT.title, 0, 60 * U); ctx.restore(); ctx.fillStyle = tg; ctx.fillText(TXT.title, 0, 60 * U);
  ctx.textAlign = 'left'; ctx.restore();
  const sw2 = clamp((u - 0.5) / 0.9); if (sw2 > 0 && sw2 < 1) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const x = lerp(-W * 0.3, W * 1.3, sw2), lg = ctx.createLinearGradient(x - 120 * U, 0, x + 120 * U, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.35)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.setTransform(1, 0, -0.3, 1, 0, 0); ctx.fillStyle = lg; ctx.fillRect(x - 300 * U, 0, 600 * U + H * 0.3, H); ctx.restore(); }
  const fl = Math.max(0, 1 - u / 0.3); if (fl > 0) { ctx.fillStyle = `rgba(255,240,250,${fl})`; ctx.fillRect(0, 0, W, H); }
}
function endCard() {
  const u = t - T.end; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); const a = clamp(u / 0.5), k = 0.94 + 0.06 * ease(u / 1.2);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * 0.4); ctx.scale(k, k); const lw = 700 * U, lh = lw * 560 / 460; ctx.shadowColor = 'rgba(255,63,180,0.55)'; ctx.shadowBlur = 60 * U * (0.8 + 0.2 * Math.sin(t * 4));
  ctx.drawImage(IMG[3], 250, 30, 460, 560, -lw / 2, -lh / 2, lw, lh); ctx.restore();
  const cq = sp(T.end + 0.6, 180, 18); ctx.save(); ctx.globalAlpha = clamp(cq * 2); shadowText(TXT.cta, W / 2, H * 0.4 + 520 * U, 900, 60 * U, '#ffffff'); ctx.restore();
  const sq = sp(T.end + 1.1, 180, 18); ctx.save(); ctx.globalAlpha = clamp(sq * 2); text(TXT.soon, W / 2, H * 0.4 + 600 * U, 500, 38 * U, '#ff9fd6', 'center', 4 * U); ctx.restore();
}

function seek(time) {
  t = time; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t >= T.end) endCard();
  else if (t >= T.title) titleCard();
  else if (t >= T.phone[0] && t < T.phone[1]) phone();
  else { const s = SHOTS.find((x) => t >= x[0] && t < x[1]); if (s) shot(s, s === SHOTS[0] ? clamp((t - s[0]) / 0.6) : 1);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; if (s) { ctx.fillRect(0, BY - 2 * U, W, 2 * U); ctx.fillRect(0, BY + BH, W, 2 * U); } }
  // Untertitel, Präsentiert, Minimap und Missions-Text, Vorteile, Schlusszeile
  T.sub.forEach(([a, b2, ...ls]) => { if (t < a || t > b2) return; const al = Math.min(clamp((t - a) / 0.25), clamp((b2 - t) / 0.25)); ctx.save(); ctx.globalAlpha = al; ls.forEach((l, i) => shadowText(l, W / 2, BY + BH + 110 * U + i * 60 * U, 500, 46 * U, '#ffffff')); ctx.restore(); });
  if (t > SHOTS[0][0] && t < SHOTS[0][1]) { const al = Math.min(clamp((t - SHOTS[0][0] - 0.3) / 0.5), clamp((SHOTS[0][1] - t) / 0.3)); ctx.save(); ctx.globalAlpha = al * 0.9; text(TXT.presents, W / 2, BY - 90 * U, 700, 28 * U, '#ffffff', 'center', 12 * U); ctx.restore(); }
  if (t >= T.mission[0] - 0.4 && t < T.mission[1]) { const al = Math.min(clamp((t - T.mission[0] + 0.4) / 0.3), clamp((T.mission[1] - t) / 0.2)); minimap(al);
    const mq = sp(T.mission[0], 200, 20); if (mq > 0) { ctx.save(); ctx.globalAlpha = clamp(mq * 2) * clamp((T.mission[1] - t) / 0.2); ctx.font = `700 ${50 * U}px "Kanit"`; const w1 = ctx.measureText(TXT.mission[0] + ' ').width, w2 = ctx.measureText(TXT.mission[1]).width, x0 = W / 2 - (w1 + w2) / 2;
      shadowText(TXT.mission[0], x0, BY + BH + 120 * U, 700, 50 * U, '#ffffff', 'left'); shadowText(TXT.mission[1], x0 + w1, BY + BH + 120 * U, 700, 50 * U, GOLD, 'left'); ctx.restore(); } }
  if (t >= T.pros[0] && t < T.tag[0]) pros();
  if (t >= T.tag[0] && t < T.tag[1]) { const al = Math.min(clamp((t - T.tag[0]) / 0.3), clamp((T.tag[1] - t) / 0.25)); ctx.save(); ctx.globalAlpha = al; shadowText(TXT.tag, W / 2, BY + BH + 130 * U, 900, 62 * U, '#ffffff'); ctx.restore(); }
  // Film: warme Tönung, Korn, Vignette
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,140,90,0.22)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16; const fr = Math.floor(t * 24), gi = GRAIN[fr % 3], ox = Math.floor(hash(fr) * 60), oy = Math.floor(hash(fr + 7) * 60);
  ctx.drawImage(gi, ox, oy, 210, 420, 0, 0, W, H); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.72); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
await Promise.all([document.fonts.load('500 40px "Kanit"'), document.fonts.load('700 40px "Kanit"'), document.fonts.load('900 40px "Kanit"'), document.fonts.load('italic 900 40px "Kanit"'), ...IMG.slice(1).map((i) => i.decode())]);
window.seek = seek;
seek(0);
</script>
</body>
</html>
