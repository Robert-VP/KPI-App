<body>
<canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, spring, track, springType, hash } from '../../lib/motion.js';
import { T, DUR, CHAPTERS, CAPTIONS, OVERVIEW } from './timeline.mjs';
// LinkedIn-Fassung mit klarer Gliederung: jedes Element nur in seinem Kapitel, groß in der Bildmitte, Anleitung als Untertitel.

/* ============================================================
   Job-Alarm erklärt: Die Anzeige baut sich auf, die Kamera führt durch
   die drei Schritte (Suche festlegen → E-Mail bestätigen → Stellen kommen ins Postfach)
   und endet auf der Anzeige 1:1. Maße aus der Vorlage (1080×1350) ausgemessen.

const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = window.innerWidth, H = window.innerHeight; c.width = W; c.height = H;
const FF = "'Inter', 'Segoe UI', Arial, sans-serif";
const CI = { bg: '#F4F5F6', ink: '#111418', navy: '#0F3556', steel: '#2E6FB2', steelHi: '#5E9DCD', gold: '#E8C33C', grau: '#8A8F98', chip: '#EDF0F4', feld: '#F6F7F9', linie: '#E4E8ED', gruen: '#2E7D32', crimson: '#8B1A3C' };

const logo = new Image(); logo.src = '../../assets/vp-tools/logo/logo-hell.png';
await new Promise((r) => { logo.onload = r; logo.onerror = r; });

/* ---------- Bühne: Vorlage 1080 breit, Inhalt bis y 1215, darunter das Fußband ---------- */
const M = Math.round(W * 0.09), FOOT = Math.round(H * 0.122), footTop = H - FOOT, CONTENT = 1190;   // Fußband wie in den Stellenanzeigen
let s, ox = 0, oy = 0, eB = 0, eC = 0;
if (footTop / (W / 1080) >= CONTENT) { s = W / 1080; const extra = footTop / s - CONTENT; eB = extra * 0.3; eC = extra * 0.62; }   // 9:16: Luft verteilen

const OFF = { A: 0, B: eB, C: eC };

/* ---------- Dreiecksmotiv oben rechts (aus renderCIHell() der Stellenanzeigen) ---------- */
function ciRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
function ciMix(h1, h2, f) { const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; const a = p(h1), b = p(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`; }
const TRI = [];
{
  const rnd = ciRng(20260714), fadeBand = H * 0.10;
  const xTh = ox + 790 * s, ptA = oy + (185 + eB) * s - H * 0.02, ptB = oy + (505 + eB) * s - H * 0.02;   // links über der Headline enger, rechts bis zu den Bereichen
  const fieldAt = (x, y) => { const cx = W * 1.02, cy = -H * 0.06, rx = W * 0.74, ry = H * 0.36; const d = Math.sqrt(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2); const wob = (Math.sin(x * 0.011 + y * 0.017) + Math.sin(y * 0.009 - x * 0.006)) * 0.09; return 1 - (d + wob) + (rnd() - 0.5) * 0.16; };
  const fadeAt = (x, y, r, cc) => { const pt = x < xTh ? ptA : ptB; if (y <= pt - fadeBand) return 1; const fade = Math.min(1, Math.max(0, (pt - y) / fadeBand)); const zh = ((Math.imul(r + 1, 73856093) ^ Math.imul(cc + 7, 19349663)) >>> 0) % 1000 / 1000; return (fade <= 0 || zh > fade) ? -1 : fade; };
  const cell = Math.max(12, Math.round(W / 42)), colStep = cell * 0.5, rowStep = cell * 0.866;
  const rows = Math.ceil((H * 0.42) / rowStep), cols = Math.ceil(W / colStep) + 2;
  for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) {
    const x = cc * colStep, y = r * rowStep + rowStep * 0.5; const tt = fieldAt(x, y);
    if (tt <= 0.05) { rnd(); rnd(); continue; } if (tt < 0.30 && rnd() > tt / 0.30) { rnd(); continue; }
    const sz0 = 0.94 + rnd() * 0.06, core = Math.min(1, Math.max(0, (tt - 0.35) / 0.55)); const size = Math.min(cell * (0.50 + 0.42 * core) * sz0, cell * 0.86);
    const fade = fadeAt(x, y, r, cc); if (fade < 0) { rnd(); rnd(); continue; }
    const acc = rnd(); let col;
    if (acc < 0.02) col = CI.gruen; else if (acc < 0.04) col = CI.crimson; else if (acc < 0.06) col = CI.gold;
    else { const f = Math.min(1, Math.max(0, 1 - tt)) * 0.85 + rnd() * 0.15; col = (acc < 0.40) ? ciMix(CI.steelHi, '#EAF1F7', f) : ciMix(CI.navy, '#DCE7F1', f * 0.9); }
    if (size < 1.6) continue;
    TRI.push({ x, y, size, t: tt, col, up: (r + cc) % 2 === 0, alpha: Math.min(0.80, 0.30 + tt * 0.60) * (0.4 + 0.6 * fade) });
  }
}

/* ---------- Helfer ---------- */

let t = 0, camZ = 1, camX = W / 2, camY = H / 2;

const st = (t0, k = 170) => springType(t - t0, k);

function text(str, x, y, w, px, color, align = 'left', ls = 0) { font(w, px, ls); ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y); ctx.textAlign = 'left'; ctx.letterSpacing = '0px'; }
function measure(str, w, px, ls = 0) { font(w, px, ls); const m = ctx.measureText(str).width; ctx.letterSpacing = '0px'; return m; }

function group(g) { ctx.setTransform(camZ, 0, 0, camZ, W / 2 - camX * camZ, H / 2 - camY * camZ); ctx.translate(ox, oy); ctx.scale(s, s); ctx.translate(0, OFF[g]); }
function shadow(on) { const k = s * camZ; ctx.shadowColor = on ? 'rgba(15,53,86,0.11)' : 'transparent'; ctx.shadowBlur = on ? 46 * k : 0; ctx.shadowOffsetY = on ? 14 * k : 0; }

/* ---------- Typografie aus der Vorlage (Breiten ausgemessen) ---------- */
const H1 = 'Die passende Stelle', H2 = 'kommt zu Ihnen.', LSH = -0.022;
const hS = fit(H1, 800, 686, LSH);
const SUB = [['Suche', 0], ['festlegen,', 0], ['E-Mail', 1], ['bestätigen', 1], ['–', -1], ['neue', 2], ['passende', 2], ['|'], ['Positionen', 2], ['kommen', 2], ['automatisch', 2], ['ins', 2], ['Postfach.', 2]];
const subS = fit('Suche festlegen, E-Mail bestätigen – neue passende', 400, 675);
const CHIPS = ['TGA', 'SHK', 'Kältetechnik', 'Lüftungstechnik', 'Elektrotechnik & Gebäudeautomation', 'Tiefbau', 'Umwelttechnologien'];
const chipS = fit('Elektrotechnik & Gebäudeautomation', 600, 300);
const CHIP_POS = (() => { const out = []; let x = 87, y = 528; const rowW = 890; CHIPS.forEach((label) => { const w = measure(label, 600, chipS) + 32; if (x + w > rowW + 4) { x = 87; y += 46; } out.push({ label, x, y, w, h: 36 }); x += w + 11; }); return out; })();
const SEL = CHIPS.indexOf('Kältetechnik');
const SUCHE = 'Kälte- & Klimatechnik · Süd', MAIL = 'ihr.name@beispiel.de';
const titleS = fit('Job-Alarm einrichten', 800, 289), sucheS = fit(SUCHE, 700, 250), nTitleS = fit('Eine neue Stelle für Sie', 800, 240), jobS = fit('Servicetechniker (m/w/d) Kältetechnik', 700, 342);
// Beispielstelle in der Benachrichtigung (Titel zweizeilig, Karte wächst um eine Zeile)
const JOB = { meta: 'VP-2304 · Vertrieb', titel: ['Gebietsverkaufsleiter (m/w/d)', 'Kälte- und Klimatechnik'], ort: 'Bayern West' };
const JDY = Math.round(jobS * 1.26), JY = (JOB.titel.length - 1) * JDY;
const urlS = fit('voss-partner.de/stellenangebote', 700, 430), eyeS = fit('NEU: JOB-ALARM', 800, 241, 0.26);

/* ---------- Szenenteile ---------- */
function drawCircle() {
  const p = st(T.circle, 40); if (p <= 0) return; group('C');
  const g = ctx.createLinearGradient(0, 378, 0, 1215); g.addColorStop(0, '#E7EBF2'); g.addColorStop(1, '#F2F3F5');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(918, 807, 429 * (0.6 + 0.4 * p), 0, Math.PI * 2); ctx.globalAlpha = BASE * p; ctx.fill(); ctx.globalAlpha = BASE * 1;
}
function drawMotiv() {
  ctx.setTransform(camZ, 0, 0, camZ, W / 2 - camX * camZ, H / 2 - camY * camZ); const life = t >= T.foot ? 1 : 0;
  for (const p of TRI) {
    const delay = T.circle + 0.1 + (1 - clamp(p.t)) * 0.9 + (p.x / W) * -0.15 + (p.y / H) * 0.6; const q = sp(delay, 150, 20); if (q <= 0.001) continue;
    const shimmer = life ? 0.08 * Math.sin((t - T.foot) * Math.PI * 2 / 2 + hash(p.x * 0.37 + p.y * 0.11) * 6.28) : 0;
    const size = p.size * Math.min(1.12, q), hw = size * 0.5, hh = size * 0.866 * 0.5;
    ctx.globalAlpha = BASE * clamp(p.alpha * clamp(q) + shimmer, 0, 0.9); ctx.fillStyle = p.col; ctx.beginPath();
    if (p.up) { ctx.moveTo(p.x, p.y - hh); ctx.lineTo(p.x - hw, p.y + hh); ctx.lineTo(p.x + hw, p.y + hh); } else { ctx.moveTo(p.x, p.y + hh); ctx.lineTo(p.x - hw, p.y - hh); ctx.lineTo(p.x + hw, p.y - hh); }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = BASE * 1;
}
function drawLogo() {
  if (!logo.naturalWidth) return; const p = sp(T.logo, 160, 18); if (p <= 0) return; group('A');
  const w = 80, h = w * logo.naturalHeight / logo.naturalWidth, cx = 97 + w / 2, cy = 60 + h / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(Math.max(0.001, p), Math.max(0.001, p)); ctx.globalAlpha = BASE * clamp(p * 2); ctx.drawImage(logo, -w / 2, -h / 2, w, h); ctx.restore();
}
function drawHook() {
  group('B');
  const bar = st(T.eyebrow, 260); if (bar > 0) { ctx.fillStyle = CI.gold; rr(87, 207.5, 35 * bar, 5.5, 2.75); ctx.fill(); }
  const eye = 'NEU: JOB-ALARM', n = Math.floor(eye.length * clamp((t - T.eyebrow - 0.1) / 0.45));
  if (n > 0) text(eye.slice(0, n), 136, 218.5, 800, eyeS, CI.navy, 'left', eyeS * 0.26);
  const line = (str, y0, t0, color) => {   // Wörter steigen aus einer Maske (kein Einblenden)
    ctx.save(); ctx.beginPath(); ctx.rect(60, y0 - hS * 1.0, 960, hS * 1.3); ctx.clip();
    let x = 87; str.split(' ').forEach((wd, i) => { const p = st(t0 + i * 0.09, 220); const w = measure(wd + ' ', 800, hS, hS * LSH);
      if (p > 0) text(wd, x, y0 + (1 - p) * hS * 1.15, 800, hS, color, 'left', hS * LSH); x += w; });
    ctx.restore();
  };
  if (t >= T.h1) line(H1, 307, T.h1, CI.ink);
  if (t >= T.h2) line(H2, 387, T.h2, CI.navy);
}
function hl() { return 0; }   // Schritte stehen jetzt in Titelkarten und Schrittmarke
function drawSub() {
  if (t < T.sub) return; group('B');
  let x = 87, y = 452, li = 0; const spW = measure(' ', 400, subS), runs = [];
  SUB.forEach(([wd, ph]) => { if (wd === '|') { x = 87; y = 492; li = 1; return; } const w = measure(wd, 400, subS); runs.push({ wd, ph, x, y, w, li }); x += w + spW; });
  [0, 1].forEach((L) => { const p = st(T.sub + L * 0.22, 180); if (p <= 0) return; const yb = L ? 492 : 452;
    ctx.save(); ctx.beginPath(); ctx.rect(60, yb - subS * 1.1, 960, subS * 1.45); ctx.clip();
    for (const r of runs.filter((r) => r.li === L)) { const h = r.ph >= 0 ? hl(r.ph) : 0; text(r.wd, r.x, r.y + (1 - p) * subS * 1.3, h > 0.5 ? 600 : 400, subS, mix(CI.grau, CI.navy, h)); }
    ctx.restore(); });
  for (let ph = 0; ph < 3; ph++) { const h = hl(ph); if (h <= 0.01) continue;   // goldene Unterstreichung wächst unter der aktiven Phrase
    for (const L of [0, 1]) { const rs = runs.filter((r) => r.ph === ph && r.li === L); if (!rs.length) continue; const x0 = rs[0].x, x1 = rs[rs.length - 1].x + rs[rs.length - 1].w;
      ctx.fillStyle = CI.gold; rr(x0, rs[0].y + subS * 0.22, (x1 - x0) * h, 4, 2); ctx.fill(); } }
}
function drawChips() {
  if (t < T.chips) return; group('B');
  const sel = st(T.tap1 + 0.05, 300) * (1 - st(T.end + 0.3, 160));
  CHIP_POS.forEach((cp, i) => { const p = sp(T.chips + i * 0.08, 260, 20); if (p <= 0) return; const on = i === SEL ? sel : 0;
    ctx.save(); ctx.translate(cp.x + cp.w / 2, cp.y + cp.h / 2); const k = 0.6 + 0.4 * p + (i === SEL ? 0.06 * pulse(T.tap1) : 0); ctx.scale(k, k); ctx.globalAlpha = BASE * clamp(p * 2.5);
    ctx.fillStyle = mix(CI.chip, CI.navy, on); rr(-cp.w / 2, -cp.h / 2, cp.w, cp.h, cp.h / 2); ctx.fill();
    text(cp.label, 0, chipS * 0.36, 600, chipS, mix(CI.navy, '#FFFFFF', on), 'center'); ctx.restore(); });
}
function bell(cx, cy, z, wig) {
  ctx.save(); ctx.translate(cx, cy - z * 0.35); ctx.rotate(wig); ctx.translate(0, z * 0.35); ctx.strokeStyle = CI.ink; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-z * 0.42, z * 0.26); ctx.quadraticCurveTo(-z * 0.3, z * 0.12, -z * 0.3, -z * 0.06); ctx.bezierCurveTo(-z * 0.3, -z * 0.42, z * 0.3, -z * 0.42, z * 0.3, -z * 0.06);
  ctx.quadraticCurveTo(z * 0.3, z * 0.12, z * 0.42, z * 0.26); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, z * 0.36, z * 0.09, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -z * 0.36); ctx.lineTo(0, -z * 0.44); ctx.stroke(); ctx.restore();
}
function check(x, y, z, p, color, lw) {   // Haken, p = Zeichenfortschritt
  if (p <= 0) return; ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const a = [x - z * 0.32, y + z * 0.02], b = [x - z * 0.08, y + z * 0.26], cc = [x + z * 0.34, y - z * 0.24]; ctx.beginPath(); ctx.moveTo(...a);
  if (p < 0.4) ctx.lineTo(lerp(a[0], b[0], p / 0.4), lerp(a[1], b[1], p / 0.4)); else { ctx.lineTo(...b); const q = (p - 0.4) / 0.6; ctx.lineTo(lerp(b[0], cc[0], q), lerp(b[1], cc[1], q)); }
  ctx.stroke(); ctx.restore();
}
function drawCard() {
  const p = sp(T.card, 120, 19); if (p <= 0) return; group('C');
  ctx.save(); ctx.translate(0, (1 - p) * 110); ctx.globalAlpha = BASE * clamp(p * 2.2);
  shadow(true); ctx.fillStyle = '#FFFFFF'; rr(87, 630, 503, 538, 28); ctx.fill(); shadow(false);
  ctx.fillStyle = CI.chip; ctx.beginPath(); ctx.arc(145, 690, 24, 0, Math.PI * 2); ctx.fill();

  text('Wir schicken Ihnen eine E-Mail, sobald eine neue', 121, 795, 400, 17, CI.grau); text('Stelle zu Ihrer Suche passt.', 121, 819, 400, 17, CI.grau);
  ctx.fillStyle = CI.feld; rr(121, 846, 435, 68, 12); ctx.fill();
  text('IHRE SUCHE', 139, 871, 700, 11.5, CI.grau, 'left', 1.4);
  const ns = Math.floor(SUCHE.length * clamp((t - T.suche) / 0.9)); if (ns > 0) text(SUCHE.slice(0, ns), 139, 896, 700, sucheS, CI.ink);
  text('E-Mail-Adresse', 121, 949, 600, 15, CI.ink);
  const focus = st(T.tapMail, 300); ctx.fillStyle = '#FFFFFF'; rr(121, 959, 435, 50, 10); ctx.fill();
  ctx.strokeStyle = mix('#D3D9E0', CI.steel, focus); ctx.lineWidth = 1.5; ctx.stroke();
  const nm = Math.floor(MAIL.length * clamp((t - T.mail) / (T.mailEnd - T.mail)));
  if (nm > 0) text(MAIL.slice(0, nm), 138, 991, 400, 18, CI.ink);
  if (t > T.tapMail && t < T.tapCheck && (t < T.mailEnd || Math.floor(t * 2.4) % 2 === 0)) { ctx.fillStyle = CI.steel; ctx.fillRect(139 + measure(MAIL.slice(0, nm), 400, 18), 972, 1.6, 24); }
  const cb = st(T.tapCheck + 0.03, 320); ctx.fillStyle = mix('#FFFFFF', CI.navy, cb); rr(121, 1026, 18, 18, 4); ctx.fill();

  const press = pulse(T.tapBtn, 0.12); ctx.save(); ctx.translate(338, 1109); ctx.scale(1 - 0.035 * press, 1 - 0.035 * press);
  ctx.fillStyle = CI.navy; rr(-217.5, -26, 435, 52, 26); ctx.fill();
  const rp = clamp((t - T.tapBtn) / 0.6); if (rp > 0 && rp < 1) { ctx.save(); rr(-217.5, -26, 435, 52, 26); ctx.clip(); ctx.fillStyle = `rgba(255,255,255,${0.22 * (1 - rp)})`; ctx.beginPath(); ctx.arc(0, 0, 30 + 260 * rp, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  text('Job-Alarm aktivieren', 0, 6, 600, 17, '#FFFFFF', 'center'); ctx.restore();
  ctx.restore();
}
function drawEnvelope() {   // Bestätigung: Brief mit goldenem Haken fliegt vom Button zur Benachrichtigung
  const q = clamp((t - T.env) / 1.5); if (q <= 0 || q >= 1) return; group('C');
  const e = 1 - (1 - q) ** 3, x = lerp(338, 600, e), y = lerp(1100, 780, e) - Math.sin(Math.PI * e) * 150, k = Math.sin(Math.PI * Math.min(1, q * 1.15)) * 1.3;

function pin(x, y) { ctx.save(); ctx.strokeStyle = CI.grau; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y - 3, 5, Math.PI * 0.85, Math.PI * 2.15); ctx.lineTo(x, y + 6); ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y - 3, 1.6, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
const INB = { x: 536, y: 738, w: 468, head: 64, rowH: 70 };   // Posteingang an der Stelle der späteren Benachrichtigung
function drawInbox() {
  const p = sp(T.inbox, 140, 18), e = st(T.open, 120); if (p <= 0 || e >= 0.999) return; group('C');
  const { x, y, w, head, rowH } = INB, h = 339 + JY, ins = sp(T.newMail, 200, 18);
