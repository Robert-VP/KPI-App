<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stellenanzeige — Video</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../../assets/vp-tools/font/inter-400.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../../assets/vp-tools/font/inter-600.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('../../assets/vp-tools/font/inter-700.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('../../assets/vp-tools/font/inter-800.ttf'); }
  html, body { margin: 0; background: #F4F5F6; }
  canvas { display: block; }
</style>
<script src="../../lib/qrcode.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, spring, track, springType, hash } from '../../lib/motion.js';

/* ============================================================
   Stellenanzeige als Film. Layout, Maße und Farben sind 1:1 aus
   renderCIHell() des VP-Tools-Generators übernommen; jedes Element
   bekommt nur noch eine Zeit. window.seek(t) ist eine reine Funktion.
   ============================================================ */
// Job-Datei: ?job=jobs/name.js (relativ zu diesem Ordner), sonst ./job.js
await new Promise((res, rej) => { const q = new URLSearchParams(location.search).get('job'); const el = document.createElement('script'); el.src = q || './job.js'; el.onload = res; el.onerror = () => rej(new Error('job file not found: ' + el.src)); document.head.appendChild(el); });
const J = window.JOB;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = window.innerWidth, H = window.innerHeight; c.width = W; c.height = H;
const FF = "'Inter', 'Segoe UI', Arial, sans-serif";
const CI = { bg: '#F4F5F6', ink: '#111418', steel: '#2E6FB2', navy: '#0F3556', steelHi: '#5E9DCD', grau: '#8A8F98',
  fussNavy: '#0B1D33', gruen: '#2E7D32', crimson: '#8B1A3C', gold: '#E8C33C', goldL: '#FBF3D6' };
const B = 0.5, bt = (n) => n * B;                  // 120 BPM

await Promise.all(['400', '600', '700', '800'].map((w) => document.fonts.load(`${w} 40px Inter`)));
const logo = new Image(); logo.src = '../../assets/vp-tools/logo/logo-hell.png';
await new Promise((r) => { logo.onload = r; logo.onerror = r; });

/* ---------- Helfer aus dem Tool ---------- */
function ciRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ciMix(h1, h2, f) { const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; const a = p(h1), b = p(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`; }
function measureLines(text, maxWidth) { const words = text.split(/\s+/); const lines = []; let line = ''; for (const word of words) { const test = line ? line + ' ' + word : word; if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; } else line = test; } if (line) lines.push(line); return lines; }
function capHeight(fs) { const m = ctx.measureText('H'); return (m && m.actualBoundingBoxAscent) ? m.actualBoundingBoxAscent : fs * 0.72; }
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.min(r, Math.max(0, w) / 2, Math.max(0, h) / 2)); };

/* ---------- Layout (einmal, zeitunabhängig) ---------- */
const M = Math.round(W * 0.09), footH = Math.round(H * 0.122), footTop = H - footH;
const isLand = W > H * 1.15, SB = isLand ? Math.round(H * 1.35) : W;
let logoBottom = Math.round(W * 0.045), L = null;
if (logo.naturalWidth) { const ar = logo.naturalHeight / logo.naturalWidth; let lw = Math.round(SB * 0.145), lh = Math.round(lw * ar); const maxLh = Math.round(H * 0.19); if (lh > maxLh) { lh = maxLh; lw = Math.round(lh / ar); } L = { x: Math.round(W * 0.055), y: Math.round(Math.min(W, H) * 0.045), w: lw, h: lh }; logoBottom = L.y + lh; }
const branche = (J.branche || '').split('\n').map((s) => s.trim()).filter(Boolean).join(' ');
const jobRaw = (J.jobtitel || '').trim() || 'Jobtitel', unter = (J.untertitel || '').trim(), region = (J.region || '').trim();
const projNr = (() => { const d = String(J.projektnr || '').replace(/\D/g, ''); return d ? 'VP-' + d : ''; })();
let job = jobRaw, mwd = '(m/w/d)'; const mm = jobRaw.match(/\(\s*m\s*\/\s*w\s*\/\s*[dx](?:\s*\/\s*d)?\s*\)\s*$/i); if (mm) job = jobRaw.slice(0, mm.index).trim() || 'Jobtitel';
const qrUrl = (J.qrUrl || '').trim(), qrAn = !!qrUrl;
const qrQs = Math.round(Math.max(footH * 1.15, W * 0.11, isLand ? H * 0.30 : 0)), qrCapS = Math.max(11, Math.round(qrQs * 0.11)), qrCapH = Math.round(qrCapS * 1.5), qrChh = qrQs + qrCapH;
const qrGrenze = qrAn ? (W - M - qrQs - Math.round(M * 0.4)) : (W - M);
const kickS = Math.max(11, Math.round(SB * 0.022 * ((J.kickerScale || 100) / 100))), subS = Math.max(11, Math.round(SB * 0.024));
const pillS = Math.max(11, Math.round(SB * 0.026 * (Math.min(170, Math.max(60, J.regionSize || 100)) / 100)));
const maxW = (isLand && qrAn) ? (qrGrenze - M) : (W - M * 2), lhF = 1.08;
const nonTitleH = (branche ? kickS * 2.3 : 0) + (unter ? subS * 3.1 : 0) + ((region || projNr) ? pillS * 5.1 : 0);
const minTop = Math.max(Math.round(H * 0.28), logoBottom + Math.round(H * 0.03));
const alarmAn = !!J.alarm, alarmH = alarmAn ? Math.round(H * 0.042) : 0, randUnten = Math.round(H * 0.075) + alarmH;
const availH = footTop - randUnten - minTop;
let titleS = Math.round(SB * 0.155); const minS = Math.max(18, Math.round(SB * 0.06)); let lines = [job];
const splitTwo = (ls) => { if (!isLand && ls.length === 1 && /\s/.test(job)) { const w = job.split(/\s+/), k = Math.ceil(w.length / 2); return [w.slice(0, k).join(' '), w.slice(k).join(' ')]; } return ls; };
while (true) {
  ctx.font = `800 ${titleS}px ${FF}`; lines = splitTwo(measureLines(job, maxW));
  ctx.font = `700 ${Math.round(titleS * 0.42)}px ${FF}`; const mwdW = ctx.measureText(mwd).width; ctx.font = `800 ${titleS}px ${FF}`;
  const fitsW = lines.length <= 3 && lines.every((l) => ctx.measureText(l).width <= maxW) && ctx.measureText(lines[lines.length - 1]).width + titleS * 0.20 + mwdW <= maxW;
  const fitsH = nonTitleH + lines.length * titleS * lhF <= availH;
  if ((fitsW && fitsH) || titleS <= minS) break; titleS -= 4;
}
const ciScale = Math.min(140, Math.max(60, J.titleScale || 100)) / 100;
if (ciScale !== 1) { titleS = Math.max(minS, Math.round(titleS * ciScale)); ctx.font = `800 ${titleS}px ${FF}`; lines = splitTwo(measureLines(job, maxW)); }
const blockH = nonTitleH + lines.length * titleS * lhF;
const yUnten = Math.max(footTop - randUnten - blockH, minTop);
const ciPos = Math.min(100, Math.max(0, J.textY || 0));
const yStart = Math.round(yUnten - (yUnten - minTop) * (ciPos / 100));
const protectTop = yStart - Math.round(H * 0.03);

/* ---------- Motiv vorberechnen (identischer Zufallsverbrauch wie im Tool) ---------- */
const dichte = Math.min(140, Math.max(40, J.dichte || 100)) / 100, fadeBand = H * 0.10;
const TRI = [], PEOPLE = [];
{
  const rnd = ciRng(J.seed || 20260714);
  const fieldAt = (x, y) => { const cx = W * 1.02, cy = -H * 0.06, rx = W * 0.74, ry = H * 0.36; const d = Math.sqrt(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2) / dichte; const wob = (Math.sin(x * 0.011 + y * 0.017) + Math.sin(y * 0.009 - x * 0.006)) * 0.09; return 1 - (d + wob) + (rnd() - 0.5) * 0.16; };
  const fadeAt = (y, r, cc) => { if (y <= protectTop - fadeBand) return 1; const fade = Math.min(1, Math.max(0, (protectTop - y) / fadeBand)); const zh = ((Math.imul(r + 1, 73856093) ^ Math.imul(cc + 7, 19349663)) >>> 0) % 1000 / 1000; return (fade <= 0 || zh > fade) ? -1 : fade; };
  if ((J.motiv || 'dreiecke') === 'menschen') {
    const cell = Math.max(15, Math.round(W / 32)); const rows = Math.ceil((H * 0.42) / cell), cols = Math.ceil(W / cell) + 2;
    for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) {
      const x = cc * cell + (r % 2 ? cell * 0.5 : 0), y = r * cell + cell * 0.5; const t = fieldAt(x, y);
      if (t <= 0.05) { rnd(); rnd(); continue; } if (t < 0.30 && rnd() > t / 0.30) { rnd(); continue; }
      const fade = fadeAt(y, r, cc); if (fade < 0) { rnd(); rnd(); continue; }
      const core = Math.min(1, Math.max(0, (t - 0.35) / 0.55)); const s = cell * (0.52 + 0.34 * core) * (0.92 + rnd() * 0.08); if (s < 5) continue;
      const acc = rnd(); let col, richtig = false;
      if (acc < 0.045) { col = CI.gold; richtig = true; } else if (acc < 0.065) { col = CI.crimson; richtig = true; } else if (acc < 0.085) { col = CI.gruen; richtig = true; }
      else { const f = Math.min(1, Math.max(0, 1 - t)) * 0.75 + rnd() * 0.15; col = (acc < 0.5) ? ciMix(CI.steel, '#B9CFE2', f) : ciMix(CI.navy, '#93ABC1', f * 0.9); }
      PEOPLE.push({ x, y, s, t, col, richtig, core, alpha: Math.min(0.95, 0.38 + t * 0.55) * (0.45 + 0.55 * fade) * (richtig ? 1.08 : 1) });
    }
  } else {
    const cell = Math.max(12, Math.round(W / 42)); const colStep = cell * 0.5, rowStep = cell * 0.866;
    const rows = Math.ceil((H * 0.42) / rowStep), cols = Math.ceil(W / colStep) + 2;
    for (let r = 0; r < rows; r++) for (let cc = -1; cc < cols; cc++) {
      const x = cc * colStep, y = r * rowStep + rowStep * 0.5; const t = fieldAt(x, y);
      if (t <= 0.05) { rnd(); rnd(); continue; } if (t < 0.30 && rnd() > t / 0.30) { rnd(); continue; }
      const s = 0.94 + rnd() * 0.06; const core = Math.min(1, Math.max(0, (t - 0.35) / 0.55));
      let size = Math.min(cell * (0.50 + 0.42 * core) * s, cell * 0.86);
      const fade = fadeAt(y, r, cc); if (fade < 0) { rnd(); rnd(); continue; }
      const acc = rnd(); let col;
      if (acc < 0.02) col = CI.gruen; else if (acc < 0.04) col = CI.crimson; else if (acc < 0.06) col = CI.gold;
      else { const f = Math.min(1, Math.max(0, 1 - t)) * 0.85 + rnd() * 0.15; col = (acc < 0.40) ? ciMix(CI.steelHi, '#EAF1F7', f) : ciMix(CI.navy, '#DCE7F1', f * 0.9); }
      if (size < 1.6) continue;
      TRI.push({ x, y, size, t, col, up: (r + cc) % 2 === 0, alpha: Math.min(0.80, 0.30 + t * 0.60) * (0.4 + 0.6 * fade) });
    }
  }
}
/* ---------- QR vorberechnen ---------- */
let QR = null;
if (qrAn) { try { const q = qrcode(0, 'M'); q.addData(qrUrl); q.make(); const n = q.getModuleCount(); const cell = Math.max(2, Math.floor(qrQs / (n + 8))); const pad = Math.round((qrQs - cell * n) / 2); const mods = []; const finder = (r, cc) => (r < 7 && cc < 7) || (r < 7 && cc >= n - 7) || (r >= n - 7 && cc < 7); for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) mods.push({ r, cc, f: finder(r, cc) }); QR = { n, cell, pad, mods, bx: Math.round(W - M - qrQs), by: Math.round(footTop - qrChh * 0.5) }; } catch (e) { QR = null; } }

/* ============================================================
   Timeline (12 s, 120 BPM). Takt 1 Motiv+Logo · Takt 2 Eyebrow · Takt 2–3 Headline
   · Takt 3–4 Untertitel+Pille · Takt 4–5 Fußband · Takt 5–6 QR · Takt 6 Job-Alarm · Rest: Halten mit Leben
   ============================================================ */
let t = 0;
const SWAP = !!(J.punkte && J.punkte.length) || !!J.hinweis;   // zweite Textebene vorhanden?
const punkte = (J.punkte || []).join(' · '), hinweis = (J.hinweis || '').trim();
const T = SWAP
  ? { motiv: bt(0), logo: bt(0.5), kick: bt(2), title: bt(3.5), mwd: bt(5.5), sub: bt(6), pill: bt(7), foot: bt(9), claim: bt(10), qr: bt(11), alarm: bt(13.5), hold: bt(15), swapIn: bt(16), swapOut: bt(21), pillPulse: -99, qrBob: bt(23), bell: bt(18.5) }
  : { motiv: bt(0), logo: bt(0.5), kick: bt(2), title: bt(3.5), mwd: bt(5.5), sub: bt(6), pill: bt(7), foot: bt(9), claim: bt(10), qr: bt(11), alarm: bt(13.5), hold: bt(15), pillPulse: bt(17), qrBob: bt(20), bell: bt(22) };
// Textwechsel: 0 = erster Text, 1 = zweiter Text (Löschen und Tippen laufen über die Zeichenzahl)
const swapPhase = () => (!SWAP || t < T.swapIn) ? 0 : (t < T.swapOut ? 1 : 2);
// kurzer Impuls: Spring hoch und wieder zurück (für „Leben“ im Halten)
const pulse = (t0, k = 260, d = 18) => clamp(spring(t - t0, k, d) - spring(t - t0 - 0.16, k, d));
const sp = (t0, k = 170, d = 26) => spring(t - t0, k, d);
const typeN = (str, t0, step) => t < t0 ? 0 : Math.min(str.length, Math.floor((t - t0) / step) + 1);

function drawMotiv() {
  const life = t >= T.hold ? 1 : 0;
  for (const p of TRI) {
    // Welle von oben rechts: Kern zuerst (hohes t), Rand zuletzt – jedes Dreieck federt mit kleinem Overshoot ein
    const delay = T.motiv + (1 - clamp(p.t)) * 0.9 + (p.x / W) * -0.15 + (p.y / H) * 0.6;
    const s = sp(delay, 150, 20); if (s <= 0.001) continue;
    // Leben im Halten: leichtes Schimmern auf dem Beat (deterministisch)
    const shimmer = life ? 0.08 * Math.sin((t - T.hold) * Math.PI * 2 / 2 + hash(p.x * 0.37 + p.y * 0.11) * 6.28) : 0;
    const size = p.size * Math.min(1.12, s), hw = size * 0.5, hh = size * 0.866 * 0.5;
    ctx.globalAlpha = clamp(p.alpha * clamp(s) + shimmer, 0, 0.9); ctx.fillStyle = p.col; ctx.beginPath();
    if (p.up) { ctx.moveTo(p.x, p.y - hh); ctx.lineTo(p.x - hw, p.y + hh); ctx.lineTo(p.x + hw, p.y + hh); } else { ctx.moveTo(p.x, p.y + hh); ctx.lineTo(p.x - hw, p.y - hh); ctx.lineTo(p.x + hw, p.y - hh); }
    ctx.closePath(); ctx.fill();
  }
  for (const p of PEOPLE) {
    const delay = T.motiv + (1 - clamp(p.t)) * 0.9 + (p.y / H) * 0.6; const s = sp(delay, 150, 20); if (s <= 0.001) continue;
    const sz = p.s * Math.min(1.1, s); const hr = sz * 0.26, hx = p.x, hy = p.y - sz * 0.36, bw = sz * 0.88, bh = sz * 0.52, bx = p.x - bw / 2, by = p.y - sz * 0.02;
    ctx.globalAlpha = p.alpha * clamp(s); ctx.fillStyle = p.col; ctx.strokeStyle = p.col;
    if (p.richtig || p.core > 0.30) { ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, [bw * 0.5, bw * 0.5, sz * 0.10, sz * 0.10]); ctx.fill(); }
    else { ctx.lineWidth = Math.max(1.2, sz * 0.09); ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, [bw * 0.5, bw * 0.5, sz * 0.10, sz * 0.10]); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}
function drawLogo() {
  if (!L) return; const s = sp(T.logo, 110, 17); if (s <= 0) return;
  ctx.save(); ctx.translate(L.x + L.w / 2, L.y + L.h / 2); ctx.translate(-(1 - s) * (L.x + L.w), -(1 - s) * 80); ctx.scale(0.6 + 0.4 * s, 0.6 + 0.4 * s);
  ctx.drawImage(logo, -L.w / 2, -L.h / 2, L.w, L.h); ctx.restore();
}
function drawText() {
  let y = yStart;
  if (branche) {
    y += kickS; ctx.font = `700 ${kickS}px ${FF}`;
    const kbH = Math.max(3, kickS * 0.26), kbW = kickS * 1.7; const sw = sp(T.kick, 220, 24);
    ctx.fillStyle = CI.gold; rr(M, y - kickS * 0.36 - kbH / 2, kbW * clamp(sw), kbH, kbH / 2); ctx.fill();
    ctx.fillStyle = CI.navy; let x = M + kbW + kickS * 0.6; const txt = branche.toUpperCase(); const n = typeN(txt, T.kick + 0.15, 0.0625);
    for (let i = 0; i < n; i++) { const ch = txt[i]; const pop = sp(T.kick + 0.15 + i * 0.0625, 300, 22); ctx.save(); ctx.globalAlpha = clamp(pop * 2); ctx.translate(x, y); ctx.translate(0, (1 - clamp(pop)) * kickS * 0.4); ctx.fillText(ch, 0, 0); ctx.restore(); x += ctx.measureText(ch).width + kickS * 0.34; }
    y += kickS * 1.3;
  }
  // Headline: Zeilen schieben sich an der Grundlinie maskiert hoch (kein Overshoot auf Type)
  ctx.font = `800 ${titleS}px ${FF}`; ctx.textBaseline = 'alphabetic'; y += titleS * 0.82;
  const grad = (x0, w) => { const g = ctx.createLinearGradient(x0, 0, x0 + Math.max(w, 1), 0); g.addColorStop(0, CI.navy); g.addColorStop(1, CI.steel); return g; };
  const drawMwd = (x, yy) => { const s = sp(T.mwd, 260, 22); if (s <= 0) return; ctx.save(); ctx.font = `700 ${Math.round(titleS * 0.42)}px ${FF}`; ctx.fillStyle = '#8A93A0'; ctx.translate(x, yy); ctx.scale(Math.max(0.001, s), Math.max(0.001, s)); ctx.fillText(mwd, 0, 0); ctx.restore(); };
  const lineIn = (i, draw) => { const s = springType(t - (T.title + i * 0.3), 90); if (s <= 0) return; const yy = y + i * titleS * lhF; ctx.save(); ctx.beginPath(); ctx.rect(0, yy - titleS * 1.05, W, titleS * 1.35); ctx.clip(); ctx.translate(0, (1 - s) * titleS * 1.2); draw(yy); ctx.restore(); };
  if (lines.length === 1) {
    const words = lines[0].split(/\s+/);
    lineIn(0, (yy) => { if (words.length > 1) { const first = words[0] + ' ', rest = words.slice(1).join(' '); const fw = ctx.measureText(first).width, rw = ctx.measureText(rest).width; ctx.fillStyle = CI.ink; ctx.fillText(first, M, yy); ctx.fillStyle = grad(M + fw, rw); ctx.fillText(rest, M + fw, yy); } else { const lw = ctx.measureText(lines[0]).width; ctx.fillStyle = grad(M, lw); ctx.fillText(lines[0], M, yy); } });
    const lw = ctx.measureText(lines[0]).width; drawMwd(M + lw + titleS * 0.20, y);
  } else {
    lines.forEach((ln, i) => lineIn(i, (yy) => { const lw = ctx.measureText(ln).width; ctx.fillStyle = (i === 0) ? CI.ink : grad(M, lw); ctx.fillText(ln, M, yy); }));
    const last = lines.length - 1; drawMwd(M + ctx.measureText(lines[last]).width + titleS * 0.20, y + last * titleS * lhF);
  }
  y += (lines.length - 1) * titleS * lhF;
  if (unter) {
    y += subS * 2.9; let subS2 = subS; ctx.font = `400 ${subS2}px ${FF}`;
    while (subS2 > 10 && ctx.measureText(unter).width > qrGrenze - M) { subS2 -= 1; ctx.font = `400 ${subS2}px ${FF}`; }
    let shown = unter.slice(0, typeN(unter, T.sub, 0.018));
    if (SWAP && punkte) {
      const ph = swapPhase(); const erase = (str, t0) => str.slice(0, Math.max(0, str.length - Math.floor(Math.max(0, t - t0) / 0.007)));
      const eraseDur = (str) => str.length * 0.007;
      if (ph === 1) { const e = erase(unter, T.swapIn); shown = e.length ? e : punkte.slice(0, typeN(punkte, T.swapIn + eraseDur(unter), 0.009)); }
      if (ph === 2) { const e = erase(punkte, T.swapOut); shown = e.length ? e : unter.slice(0, typeN(unter, T.swapOut + eraseDur(punkte), 0.012)); }
      let subS3 = subS; ctx.font = `400 ${subS3}px ${FF}`; while (subS3 > 10 && ctx.measureText(punkte).width > qrGrenze - M) { subS3 -= 1; ctx.font = `400 ${subS3}px ${FF}`; }
    }
    ctx.fillStyle = CI.grau; ctx.fillText(shown, M, y);
  }
  let pillX = M;
  if (projNr) {
    if (!region) y += pillS * 4.4; ctx.font = `700 ${pillS}px ${FF}`; const ntw = ctx.measureText(projNr).width, ncap = capHeight(pillS), npx = pillS * 1.0, npy = pillS * 0.62, nph = ncap + npy * 2, npw = ntw + npx * 2, npt = (region ? y + pillS * 4.4 : y) - nph;
    const s = sp(T.pill - 0.25, 180, 20); if (s > 0) { ctx.save(); ctx.translate(M + npw / 2, npt + nph / 2); ctx.scale(Math.max(0.001, s), Math.max(0.001, s)); ctx.translate(-(M + npw / 2), -(npt + nph / 2)); rr(M, npt, npw, nph, nph / 2); ctx.fillStyle = CI.goldL; ctx.fill(); ctx.fillStyle = CI.navy; ctx.fillText(projNr, M + npx, npt + nph / 2 + ncap / 2); ctx.restore(); }
    pillX = M + npw + pillS * 0.6;
  }
  if (region) {
    y += pillS * 4.4; let pillS2 = pillS; ctx.font = `700 ${pillS2}px ${FF}`;
    while (pillS2 > 10 && ctx.measureText(region).width + pillS2 * 2.3 > qrGrenze - pillX) { pillS2 -= 1; ctx.font = `700 ${pillS2}px ${FF}`; }
    const tw = ctx.measureText(region).width, capH = capHeight(pillS2), padX = pillS2 * 1.15, padY = pillS2 * 0.62, ph = capH + padY * 2, pw = tw + padX * 2, pt = y - ph;

    const wLinks = Math.max(wLinks1, ctx.measureText('Ahlen · Stuttgart').width, ctx.measureText(tel).width); const wClaim = Math.max(wClaim1, ctx.measureText('Personalberatung seit 1992.').width, zusatz ? ctx.measureText(zusatz).width : 0);

    ctx.font = `700 ${fuss1}px ${FF}`; const dotX = claimLinks + ctx.measureText('Wir finden die Richtigen').width;
